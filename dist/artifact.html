<title>萌獸冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* 萌獸冒險：卡通貼紙風 ─ 深藍描邊 ＋ 糖果色，單一明亮主題 */
:root {
  --ink: #23305E;
  --ink-2: #4A5688;
  --ink-3: #8C95BD;
  --paper: #FFFDF6;
  --paper-2: #F2F5FF;
  --sky-a: #A6DEFF;
  --sky-b: #FFF2CF;
  --sun: #FFD23F;
  --sun-d: #E8B600;
  --berry: #FF5D8F;
  --berry-d: #D93A6C;
  --mint: #36CF9C;
  --mint-d: #18A576;
  --sea: #4F8EF0;
  --grape: #8B5CF6;
  --good: #22B573;
  --warn: #F29A1F;
  --bad: #E5484D;
  --hp-hi: #3DDC84;
  --hp-mid: #FFC933;
  --hp-lo: #FF5A5A;
  --font-ui: 'Huninn', 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
  --font-num: 'Baloo 2', 'Huninn', 'Noto Sans TC', sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 10px;
  --pop: 0 4px 0 var(--ink);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 16px;
  color: var(--ink);
  background:
    radial-gradient(circle at 12px 12px, rgba(255, 255, 255, .55) 2.5px, transparent 3px) 0 0 / 34px 34px,
    linear-gradient(180deg, var(--sky-a) 0%, #CDEBFF 45%, var(--sky-b) 100%) fixed;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font-family: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--berry); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#app { min-height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* ── 通用元件 ── */
.panel {
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: var(--r-lg);
  box-shadow: 0 5px 0 var(--ink);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 700; font-size: 16px; line-height: 1.2;
  background: var(--sun); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 14px;
  padding: 10px 18px; box-shadow: var(--pop);
  cursor: pointer; user-select: none;
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn[disabled], .btn.off { filter: grayscale(.8) opacity(.55); cursor: not-allowed; transform: none; box-shadow: var(--pop); }
.btn.pink { background: var(--berry); color: #fff; }
.btn.mint { background: var(--mint); color: #fff; }
.btn.blue { background: var(--sea); color: #fff; }
.btn.grape { background: var(--grape); color: #fff; }
.btn.white { background: #fff; }
.btn.sm { font-size: 14px; padding: 6px 12px; border-radius: 11px; }
.btn.lg { font-size: 20px; padding: 14px 26px; border-radius: 18px; }
.btn.pink, .btn.mint, .btn.blue, .btn.grape { text-shadow: 0 1.5px 0 rgba(0, 0, 0, .25); }

.tbadge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 9px 2px 6px; border-radius: 999px;
  background: var(--tc); color: #fff; font-weight: 700; font-size: 13px; line-height: 1.5;
  border: 2px solid rgba(20, 20, 50, .22);
  text-shadow: 0 1px 0 rgba(0, 0, 0, .3);
  white-space: nowrap;
}
.tbadge i { font-style: normal; font-size: 12px; text-shadow: none; }
.tbadge.sm { font-size: 11.5px; padding: 0 7px 0 5px; }
.tbadge.sm i { font-size: 10.5px; }

.chip {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
  background: var(--paper-2); border: 2px solid var(--ink); color: var(--ink);
  white-space: nowrap;
}
.chip.st { color: #fff; border-color: rgba(0, 0, 0, .2); background: var(--sc); }
.chip.up { background: #DDF0FF; color: #1D5FB8; border-color: #1D5FB8; }
.chip.down { background: #FFE3E6; color: #B5283A; border-color: #B5283A; }
.chip.dmax { background: linear-gradient(90deg, #FF5D8F, #B27BFF); color: #fff; border-color: var(--ink); }

.hpbar { position: relative; height: 12px; background: #3B4370; border: 2.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.hpbar > i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--hp-hi); border-radius: 999px; transition: width .55s ease, background-color .3s; }
.hpbar > i::after { content: ''; position: absolute; left: 4px; right: 4px; top: 2px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.hpbar.mid > i { background: var(--hp-mid); }
.hpbar.lo > i { background: var(--hp-lo); }
.expbar { height: 6px; background: #D9DEF5; border-radius: 999px; overflow: hidden; border: 2px solid var(--ink); }
.expbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5BC8FF, #4F8EF0); transition: width .6s ease; }

.hearts { color: var(--berry); letter-spacing: 1px; font-size: 14px; }
.hearts .off { color: #D8DCEB; }

/* 萌獸 SVG */
.mon-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.mon-svg .mon-body { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.mon-svg.floaty .mon-body { animation: floaty 3s ease-in-out infinite; }
.mon-svg.still .mon-body, .mon-svg.still .eye.blink { animation: none; }
.eye.blink { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; animation-delay: var(--blink-delay, 0s); }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-3px) scale(1.012, .988); } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.1); } }
.silhouette .mon-svg { filter: brightness(0) opacity(.28); }
.silhouette .mon-svg .mon-body, .silhouette .eye.blink { animation: none; }

/* ── HUD ── */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 16px; margin: 10px 16px 0;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: var(--pop);
}
.hud-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hud-avatar { width: 42px; height: 42px; border-radius: 50%; background: #FFE9A8; border: 3px solid var(--ink); overflow: hidden; flex: none; }
.hud-avatar svg { width: 100%; height: 100%; }
.hud-name { font-weight: 700; font-size: 17px; line-height: 1.1; }
.hud-money { font-size: 15px; color: var(--ink-2); }
.hud-badges { display: flex; gap: 4px; margin: 0 auto; flex-wrap: wrap; }
.badge-slot { width: 30px; height: 30px; border-radius: 50%; border: 2.5px dashed var(--ink-3); display: grid; place-items: center; font-size: 15px; background: var(--paper-2); }
.badge-slot.got { border: 2.5px solid var(--ink); background: var(--bc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18), 0 2px 0 var(--ink); }
.hud-menu { display: flex; gap: 6px; flex-wrap: wrap; }
.hud-menu .btn { padding: 6px 10px; font-size: 14px; }

/* ── 標題畫面 ── */
.title-screen { flex: 1; display: grid; place-items: center; padding: 24px 16px; position: relative; overflow: hidden; }
.title-card { position: relative; z-index: 2; text-align: center; max-width: 640px; width: 100%; padding: 30px 24px 26px; }
.logo { margin: 0; line-height: 1; }
.logo .l1 {
  display: block; font-size: clamp(54px, 11vw, 96px); font-weight: 900; letter-spacing: 4px;
  color: var(--sun);
  -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill;
  text-shadow: 0 7px 0 var(--ink);
  transform: rotate(-3deg);
}
.logo .l2 {
  display: inline-block; margin-top: 14px; font-size: clamp(18px, 3.6vw, 24px); font-weight: 700; letter-spacing: 3px;
  background: var(--berry); color: #fff; padding: 6px 18px; border-radius: 999px; border: 3px solid var(--ink); box-shadow: var(--pop);
}
.title-mons { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.title-mons .tm { position: absolute; width: clamp(90px, 15vw, 160px); aspect-ratio: 1; }
.title-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 26px; }
.title-actions .btn { min-width: 230px; }
.title-foot { margin-top: 18px; font-size: 13px; color: var(--ink-2); }

.form-row { display: flex; flex-direction: column; gap: 6px; text-align: left; margin-bottom: 14px; }
.form-row label { font-weight: 700; }
.input {
  font: inherit; font-size: 18px; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--ink);
  background: #fff; color: var(--ink); width: 100%;
}
.diff-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.diff-opt { text-align: left; padding: 10px 12px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.diff-opt b { display: block; font-size: 17px; }
.diff-opt span { font-size: 13px; color: var(--ink-2); }
.diff-opt.on { background: #FFF3BF; outline: 3px solid var(--berry); outline-offset: 1px; }

/* ── 選御三家 ── */
.starter-screen { flex: 1; padding: 20px 16px 30px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.starter-head { text-align: center; padding: 14px 22px; max-width: 760px; }
.starter-head h2 { margin: 0 0 4px; font-size: 26px; }
.starter-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 980px; }
.starter-card { padding: 12px 14px 16px; text-align: center; cursor: pointer; transition: transform .15s; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.starter-card:hover { transform: translateY(-4px) rotate(-.5deg); }
.starter-card.on { background: #FFF6D6; outline: 4px solid var(--berry); outline-offset: 2px; }
.starter-card .art { width: min(190px, 100%); aspect-ratio: 1; }
.starter-card h3 { margin: 0; font-size: 22px; }
.starter-card p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.starter-card .pros { font-size: 13px; background: var(--paper-2); border-radius: 12px; padding: 6px 10px; border: 2px dashed var(--ink-3); }

/* ── 對話框 ── */
.dialog-layer { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: rgba(35, 48, 94, .25); }
.dialog-box { display: flex; gap: 14px; align-items: flex-end; width: 100%; max-width: 820px; padding: 14px 18px; cursor: pointer; animation: popIn .25s ease; }
.dialog-face { width: 96px; height: 104px; flex: none; background: #FFF3BF; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; }
.dialog-face svg { width: 100%; height: 100%; }
.dialog-text { flex: 1; min-width: 0; }
.dialog-who { display: inline-block; font-weight: 700; background: var(--sea); color: #fff; padding: 2px 12px; border-radius: 999px; border: 2.5px solid var(--ink); margin-bottom: 6px; font-size: 14px; }
.dialog-line { font-size: 19px; line-height: 1.6; min-height: 3.2em; }
.dialog-next { text-align: right; color: var(--berry); font-size: 14px; animation: nudge 1s infinite; }
@keyframes nudge { 50% { transform: translateY(3px); } }
@keyframes popIn { from { transform: translateY(16px) scale(.96); opacity: 0; } }

/* ── 彈出視窗 ── */
.modal-layer { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(35, 48, 94, .45); }
.modal { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; animation: popIn .2s ease; }
.modal.wide { max-width: 920px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 3px solid var(--ink); background: var(--sun); border-radius: 19px 19px 0 0; }
.modal-head h3 { margin: 0; font-size: 20px; flex: 1; min-width: 0; }
.modal-x { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 0 var(--ink); }
.modal-body { padding: 16px; overflow: auto; min-height: 0; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 16px; border-top: 3px dashed var(--ink-3); }

.toast-layer { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 700; box-shadow: 0 4px 0 rgba(0, 0, 0, .25); animation: popIn .2s ease; }

/* ── 地圖 ── */
.map-screen { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 14px 16px 20px; min-height: 0; align-items: start; }
.map-box { padding: 8px; overflow: hidden; display: flex; }
.map-svg { width: 100%; height: auto; display: block; border-radius: 16px; }
.map-node { cursor: pointer; }
.map-node .ring { transition: transform .15s; transform-box: fill-box; transform-origin: center; }
.map-node:hover .ring { transform: scale(1.12); }
.map-node.locked { cursor: not-allowed; }
.map-pin { animation: pin 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes pin { 50% { transform: translateY(-7px); } }
.loc-panel { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.loc-hero { position: relative; height: 150px; border-bottom: 3px solid var(--ink); border-radius: 19px 19px 0 0; overflow: hidden; flex: none; }
.loc-hero .scene-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.loc-title { position: absolute; left: 12px; bottom: 10px; right: 12px; }
.loc-title h2 { display: inline-block; margin: 0; font-size: 26px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 2px 14px; box-shadow: 0 3px 0 var(--ink); }
.loc-body { padding: 12px 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.loc-desc { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
.loc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.loc-actions .btn { padding: 12px 10px; font-size: 16px; }
.loc-actions .wide { grid-column: span 2; }
.loc-sec h4 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.wild-list { display: flex; flex-wrap: wrap; gap: 4px; }
.wild-list .wm { width: 54px; height: 54px; background: var(--paper-2); border-radius: 12px; border: 2px solid #D5DBF0; }
.tr-row { display: flex; align-items: center; gap: 10px; padding: 8px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; }
.tr-row + .tr-row { margin-top: 8px; }
.tr-face { width: 46px; height: 50px; flex: none; border-radius: 12px; background: #FFF3BF; border: 2px solid var(--ink); overflow: hidden; }
.tr-face svg { width: 100%; height: 100%; }
.tr-info { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.tr-info b { font-size: 15px; }
.tr-info small { color: var(--ink-2); }
.done-mark { color: var(--good); font-weight: 700; font-size: 13px; }

/* ── 對戰 ── */
.bt-screen { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; padding: 12px 16px 16px; min-height: 0; align-content: start; }
.bt-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bt-stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 230px);
  border: 3px solid var(--ink); border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 5px 0 var(--ink);
  container-type: inline-size; background: #BDE6FF;
}
.bt-scene { position: absolute; inset: 0; }
.bt-scene svg { width: 100%; height: 100%; display: block; }
.bt-plat { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255, 255, 255, .55), rgba(255, 255, 255, .15) 60%, transparent 72%); }
.bt-plat.e { right: 7%; top: 47%; width: 36cqw; height: 9cqw; }
.bt-plat.p { left: 0%; bottom: -3%; width: 46cqw; height: 11cqw; }
.bt-mon { position: absolute; }
.bt-mon.e { right: 11%; top: 6%; width: 29cqw; aspect-ratio: 1; }
.bt-mon.p { left: 5%; bottom: -6%; width: 36cqw; aspect-ratio: 1; }
.bt-mon .wrap, .bt-mon .scale { width: 100%; height: 100%; }
.bt-mon .scale { transition: transform .6s cubic-bezier(.3, 1.6, .5, 1), filter .4s; transform-origin: 50% 85%; }
.bt-mon.p .scale svg { transform: scaleX(-1); }
.bt-mon.dmax .scale { transform: scale(1.42); filter: drop-shadow(0 0 6px #FF5D8F) drop-shadow(0 0 14px #B27BFF); }
.bt-mon.e.dmax .scale { transform: scale(1.32) translateY(4%); }
.bt-mon.gone .scale { transform: scale(0); }
.bt-trainer { position: absolute; right: 6%; top: 8%; width: 20cqw; aspect-ratio: 120 / 130; transform: translateX(140%); transition: transform .45s cubic-bezier(.3, 1.4, .5, 1); }
.bt-trainer.on { transform: none; }
.bt-trainer svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 0 rgba(35, 48, 94, .35)); }
.bt-card {
  position: absolute; width: clamp(200px, 36cqw, 330px); padding: 7px 12px 8px;
  background: rgba(255, 253, 246, .97); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
  transition: transform .35s ease, opacity .35s;
}
.bt-card.e { left: 3%; top: 5%; }
.bt-card.p { right: 3%; bottom: 6%; }
.bt-card.hide { opacity: 0; transform: translateY(-8px); }
.cd-top { display: flex; align-items: baseline; gap: 6px; }
.cd-name { font-size: clamp(15px, 2.2cqw, 20px); font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd-lv { font-family: var(--font-num); font-weight: 700; font-size: clamp(14px, 2cqw, 18px); }
.cd-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 3px 0 4px; min-height: 20px; }
.cd-hp { display: flex; align-items: center; gap: 6px; }
.cd-hp b { font-size: 11px; background: var(--ink); color: var(--sun); padding: 0 5px; border-radius: 6px; font-family: var(--font-num); }
.cd-hp .hpbar { flex: 1; }
.cd-hpnum { text-align: right; font-family: var(--font-num); font-weight: 700; font-size: 15px; margin-top: 1px; }
.cd-exp { margin-top: 3px; }
.bt-card.flash { animation: cardFlash .5s; }
@keyframes cardFlash { 30% { background: #FFF3A0; transform: scale(1.04); } }
.bt-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fx-p { position: absolute; font-size: clamp(18px, 3.4cqw, 34px); line-height: 1; will-change: transform, opacity; }
.fx-txt {
  position: absolute; font-weight: 900; font-size: clamp(16px, 3cqw, 30px); white-space: nowrap;
  -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; color: #fff; transform: translate(-50%, -50%);
}
.fx-txt.dmg { color: #FFE14D; }
.fx-txt.good { color: #7CFFB2; }
.fx-txt.bad { color: #FFC0C8; }
.fx-txt.crit { color: #FF8FB8; }
.fx-shield { position: absolute; border-radius: 50%; border: 4px solid #7FD3FF; background: radial-gradient(circle, rgba(127, 211, 255, .1), rgba(127, 211, 255, .45)); }
.fx-ball { position: absolute; width: clamp(26px, 5cqw, 46px); height: clamp(26px, 5cqw, 46px); transform: translate(-50%, -50%); }
.fx-ball svg { width: 100%; height: 100%; }
.stage-shake { animation: stageShake .4s; }
@keyframes stageShake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
.dmax-timer { position: absolute; left: 50%; top: 3%; transform: translateX(-50%); }

.bt-console { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 10px; min-height: 150px; }
.bt-msg { position: relative; padding: 14px 18px; font-size: clamp(16px, 1.9vw, 20px); line-height: 1.6; cursor: pointer; min-width: 0; }
.bt-msg p { margin: 0; }
.bt-msg .next { position: absolute; right: 14px; bottom: 8px; color: var(--berry); animation: nudge 1s infinite; display: none; }
.bt-msg.wait .next { display: block; }
.bt-msg .hint { color: var(--ink-2); font-size: 15px; }
.bt-cmd { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-width: 0; }
.cmd-btn { font-size: clamp(17px, 2vw, 21px); padding: 10px; border-radius: 16px; }

<script>
// ── js/util.js ──
// 共用小工具
window.G = window.G || {};
(function () {
  const U = (G.U = {});
  U.rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  U.chance = (p) => Math.random() * 100 < p;
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  U.uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  U.copy = (o) => JSON.parse(JSON.stringify(o));
  U.esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  U.weighted = (list) => {
    // list: [[value, weight], ...]
    const total = list.reduce((s, x) => s + x[1], 0);
    let r = Math.random() * total;
    for (const [v, w] of list) {
      if ((r -= w) < 0) return v;
    }
    return list[list.length - 1][0];
  };

  // 顏色
  U.hex2rgb = (hex) => {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  U.rgb2hex = (r, g, b) =>
    '#' + [r, g, b].map((v) => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  U.mix = (a, b, t) => {
    const A = U.hex2rgb(a), B = U.hex2rgb(b);
    return U.rgb2hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  };
  // amt > 0 變亮，amt < 0 變暗
  U.shade = (hex, amt) => (amt >= 0 ? U.mix(hex, '#ffffff', amt) : U.mix(hex, '#1b1530', -amt));

  U.fmtMoney = (n) => '$' + n.toLocaleString('en-US');

  U.storage = {
    get(k) {
      try { return localStorage.getItem(k); } catch (e) { return null; }
    },
    set(k, v) {
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    },
    del(k) {
      try { localStorage.removeItem(k); } catch (e) {}
    },
  };
})();

// ── js/cloud.js ──
// 雲端存檔：只在 claude.ai 上發布、且玩家有登入時啟用；本機開啟時不做任何事
(function () {
  const C = (G.Cloud = { ready: false, ref: null, busy: false, pending: null, t: null });

  // 回傳雲端上的存檔（沒有就回傳 null）
  C.init = async () => {
    if (!window.claude || typeof window.claude.use !== 'function') return null;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return null;
      const id = await user.id();
      if (!id) return null;
      C.ref = db.doc('data/users/' + id + '/game');
      const snap = await C.ref.get();
      C.ready = true;
      if (snap.exists) {
        const d = snap.data();
        if (d && typeof d.save === 'string') return JSON.parse(d.save);
      }
    } catch (e) {
      C.ready = false;
    }
    return null;
  };

  // 合併短時間內的多次存檔，一次只寫一筆
  C.push = (state) => {
    if (!C.ready) return;
    C.pending = JSON.stringify(state);
    clearTimeout(C.t);
    C.t = setTimeout(C.flush, 1500);
  };

  C.flush = async () => {
    if (!C.pending || C.busy || !C.ready) return;
    C.busy = true;
    const save = C.pending;
    C.pending = null;
    try {
      await C.ref.set({ save, savedAt: Date.now() });
    } catch (e) {
      const code = e && e.code;
      if (code === 'unavailable') C.pending = C.pending || save;
      else C.ready = false;
    }
    C.busy = false;
    if (C.pending) C.t = setTimeout(C.flush, 2500);
  };
})();

    const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
    const midi = (+m[3] + 1) * 12 + base;
    return 440 * Math.pow(2, (midi - 69) / 12);
  };

  S.init = () => {
    if (S.ctx) { if (S.ctx.state === 'suspended') S.ctx.resume(); return; }
    const want = S.want;
    try {
      S.ctx = new (window.AudioContext || window.webkitAudioContext)();
      S.master = S.ctx.createGain();
      S.master.gain.value = 0.5;
      S.master.connect(S.ctx.destination);
    } catch (e) { S.ctx = null; }
    if (want) S.music(want);
  };

  const tone = (freq, t0, dur, type = 'square', vol = 0.12, slideTo = 0, dest) => {
    const c = S.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g).connect(dest || S.master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  };
  const noise = (t0, dur, vol = 0.2, hp = 800) => {
    const c = S.ctx;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = hp;
    src.buffer = buf;
    g.gain.value = vol;
    src.connect(f).connect(g).connect(S.master);
    src.start(t0);
  };

  S.sfx = (name) => {
    if (!S.sfxOn || !S.ctx) return;
    const t = S.ctx.currentTime;
    switch (name) {
      case 'click': tone(880, t, 0.06, 'square', 0.06); break;
      case 'select': tone(660, t, 0.06, 'square', 0.07); tone(990, t + 0.06, 0.08, 'square', 0.07); break;
      case 'back': tone(520, t, 0.07, 'square', 0.06); tone(390, t + 0.06, 0.08, 'square', 0.06); break;
      case 'hit': noise(t, 0.16, 0.25, 600); tone(180, t, 0.12, 'square', 0.1, 90); break;
      case 'super': noise(t, 0.22, 0.32, 400); tone(300, t, 0.1, 'square', 0.12, 600); tone(600, t + 0.1, 0.14, 'square', 0.1, 900); break;
      case 'weak': noise(t, 0.1, 0.15, 1500); tone(220, t, 0.12, 'triangle', 0.08, 160); break;
      case 'miss': tone(500, t, 0.15, 'sine', 0.08, 200); break;
      case 'faint': tone(520, t, 0.5, 'square', 0.08, 90); break;
      case 'heal': [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.07, 0.12, 'triangle', 0.09)); break;
      case 'up': [440, 554, 659].forEach((f, i) => tone(f, t + i * 0.06, 0.1, 'square', 0.06)); break;
      case 'down': [659, 554, 440].forEach((f, i) => tone(f, t + i * 0.06, 0.1, 'square', 0.06)); break;
      case 'status': tone(300, t, 0.25, 'sawtooth', 0.05, 150); break;
      case 'levelup': ['C5', 'E5', 'G5', 'C6', 'G5', 'C6'].forEach((n, i) => tone(NOTE(n), t + i * 0.09, 0.14, 'square', 0.08)); break;
      case 'throw': tone(400, t, 0.3, 'sine', 0.08, 900); break;
      case 'shake': tone(200, t, 0.08, 'square', 0.08); tone(160, t + 0.09, 0.08, 'square', 0.07); break;
      case 'catch': ['G5', 'C6', 'E6', 'G6'].forEach((n, i) => tone(NOTE(n), t + i * 0.1, 0.2, 'square', 0.08)); break;
      case 'send': tone(300, t, 0.18, 'sine', 0.1, 900); noise(t + 0.1, 0.1, 0.12, 2000); break;
      case 'dmax': for (let i = 0; i < 8; i++) tone(200 + i * 80, t + i * 0.06, 0.2, 'sawtooth', 0.05); break;
      case 'win': ['C5', 'C5', 'C5', 'G5', '-', 'E5', 'G5', 'C6'].forEach((n, i) => n !== '-' && tone(NOTE(n), t + i * 0.12, 0.2, 'square', 0.08)); break;
      case 'buy': tone(1200, t, 0.06, 'square', 0.06); tone(1600, t + 0.07, 0.12, 'square', 0.06); break;
      case 'pet': tone(880, t, 0.1, 'sine', 0.1, 1320); break;
      case 'evo': for (let i = 0; i < 12; i++) tone(400 + i * 60, t + i * 0.08, 0.12, 'triangle', 0.06); break;
    }
  };

  // ── 背景音樂：簡單的步進音序器 ──
  const SONGS = {
    title: { bpm: 112, mel: 'E5 - G5 - C6 - B5 A5 G5 - E5 - D5 E5 F5 - E5 - C5 - D5 - E5 G5 A5 - G5 - E5 D5 C5 - D5 - - -', bass: 'C3 G3 A2 E3 F2 C3 G2 G3' },
    map: { bpm: 120, mel: 'C5 E5 G5 E5 F5 A5 G5 - E5 G5 C6 B5 A5 G5 E5 - D5 F5 A5 F5 E5 G5 C6 - B5 A5 G5 F5 E5 D5 C5 -', bass: 'C3 F3 C3 G2 D3 C3 F2 G2' },
    battle: { bpm: 156, mel: 'A4 C5 E5 A5 G5 E5 C5 E5 F5 E5 D5 C5 B4 C5 D5 E5 A4 C5 E5 A5 B5 A5 G5 E5 F5 G5 A5 G5 E5 D5 C5 B4', bass: 'A2 A2 E2 E2 F2 F2 G2 G2' },
    gym: { bpm: 164, mel: 'D5 F5 A5 D6 C6 A5 F5 A5 G5 F5 E5 D5 E5 F5 G5 A5 D5 F5 A5 D6 E6 D6 C6 A5 A#5 A5 G5 F5 E5 C5 D5 -', bass: 'D2 D2 A2 A2 A#2 A#2 C3 A2' },
  };
  S.music = (name) => {
    S.want = name;
    if (S.cur === name) return;
    S.stopMusic();
    if (!S.musicOn || !S.ctx || !SONGS[name]) return;
    S.cur = name;
    const song = SONGS[name];
    const mel = song.mel.split(' '), bass = song.bass.split(' ');
    const step = 60 / song.bpm / 2;
    let i = 0, next = S.ctx.currentTime + 0.1;
    const bus = S.ctx.createGain();
    bus.gain.value = 0.32;
    bus.connect(S.master);
    S.bus = bus;
    const tick = () => {
      if (!S.ctx) return;
      while (next < S.ctx.currentTime + 0.25) {
        const n = mel[i % mel.length];
        if (n !== '-') tone(NOTE(n), next, step * 0.9, 'square', 0.05, 0, bus);
        if (i % 4 === 0) tone(NOTE(bass[Math.floor(i / 4) % bass.length]), next, step * 3.6, 'triangle', 0.12, 0, bus);
        if (name === 'battle' || name === 'gym') if (i % 2 === 1) tone(NOTE(bass[Math.floor(i / 4) % bass.length]) * 2, next, step * 0.5, 'triangle', 0.05, 0, bus);
        next += step;
        i++;
      }
    };
    tick();
    S.timer = setInterval(tick, 100);
  };
  S.stopMusic = () => {
    if (S.timer) clearInterval(S.timer);
    S.timer = null;
    if (S.bus) {
      try { S.bus.gain.setTargetAtTime(0, S.ctx.currentTime, 0.05); } catch (e) {}
      const b = S.bus;
      setTimeout(() => { try { b.disconnect(); } catch (e) {} }, 400);
      S.bus = null;
    }
    S.cur = null;
  };
  S.setMusic = (on) => {
    S.musicOn = on;
    if (!on) S.stopMusic();
    else if (S.want) S.music(S.want);
  };
})();

// ── js/engine/mon.js ──
// 萌獸個體：建立、能力值、經驗值、招式學習
(function () {
  const U = G.U;
  const KEYS = G.STAT_KEYS;
  G.EXP_MULT = 1.6;
  G.MAX_LV = 100;

  const Mon = (G.Mon = {});

  Mon.expFor = (lv) => lv * lv * lv;

  Mon.movesAt = (sp, lv) => {
    const ls = G.SPECIES[sp].ls;
    const ids = [];
    for (const [l, id] of ls) {
      if (l > lv) break;
      const i = ids.indexOf(id);
      if (i >= 0) ids.splice(i, 1);
      ids.push(id);
    }
    return ids.slice(-4).map((id) => ({ id, pp: G.MOVES[id].pp }));
  };

  // opts: { ivs:'wild'|'trainer'|'perfect', moves:[ids], friend }
  Mon.create = (sp, lv, opts = {}) => {
    const S = G.SPECIES[sp];
    const ivs = {};
    for (const k of KEYS) {
      ivs[k] = opts.ivs === 'perfect' ? 31 : opts.ivs === 'trainer' ? opts.ivVal ?? 20 : U.rand(6, 31);
    }
    const mon = {
      uid: U.uid(),
      sp,
      nick: '',
      lv,
      exp: Mon.expFor(lv),
      ivs,
      train: { hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0 },
      friend: opts.friend ?? 30,
      ability: S.ab,
      moves: opts.moves ? opts.moves.map((id) => ({ id, pp: G.MOVES[id].pp })) : Mon.movesAt(sp, lv),
      status: null,
      slp: 0,
      hp: 1,
    };
    mon.hp = Mon.stats(mon).hp;
    return mon;
  };

  Mon.stats = (mon) => {
    const S = G.SPECIES[mon.sp];
    const out = {};
    KEYS.forEach((k, i) => {
      const b = S.bs[i];
      const iv = mon.ivs[k];
      let v = k === 'hp'
        ? Math.floor(((2 * b + iv) * mon.lv) / 100) + mon.lv + 10
        : Math.floor(((2 * b + iv) * mon.lv) / 100) + 5;
      const tr = (mon.train && mon.train[k]) || 0;
      v = Math.floor(v * (1 + tr * 0.06));
      out[k] = v;
    });
    return out;
  };

  Mon.name = (mon) => mon.nick || G.SPECIES[mon.sp].name;
  Mon.types = (mon) => G.SPECIES[mon.sp].types;

  Mon.expProgress = (mon) => {
    if (mon.lv >= G.MAX_LV) return 1;
    const a = Mon.expFor(mon.lv), b = Mon.expFor(mon.lv + 1);
    return U.clamp((mon.exp - a) / (b - a), 0, 1);
  };

  // 加經驗值，回傳升級紀錄 [{lv, newMoves:[ids]}]
  Mon.addExp = (mon, amount) => {
    const ups = [];
    if (mon.lv >= G.MAX_LV) return ups;
    mon.exp += amount;
    while (mon.lv < G.MAX_LV && mon.exp >= Mon.expFor(mon.lv + 1)) {
      const before = Mon.stats(mon).hp;
      mon.lv++;
      const after = Mon.stats(mon).hp;
      if (mon.hp > 0) mon.hp = Math.min(after, mon.hp + (after - before));
      mon.friend = Math.min(100, mon.friend + 1);
      const newMoves = G.SPECIES[mon.sp].ls.filter(([l]) => l === mon.lv).map(([, id]) => id)
        .filter((id) => !mon.moves.some((m) => m.id === id));
      ups.push({ lv: mon.lv, newMoves });
    }
    return ups;
  };

  Mon.levelUp = (mon) => {
    if (mon.lv >= G.MAX_LV) return [];
    return Mon.addExp(mon, Mon.expFor(mon.lv + 1) - mon.exp);
  };

  Mon.canEvolve = (mon) => {
    const e = G.SPECIES[mon.sp].evo;
    return e && mon.lv >= e.lv ? e.to : null;
  };

  Mon.evolve = (mon) => {
    const to = Mon.canEvolve(mon);
    if (!to) return null;
    const before = Mon.stats(mon).hp;
    mon.sp = to;
    mon.ability = G.SPECIES[to].ab;
    const after = Mon.stats(mon).hp;
    if (mon.hp > 0) mon.hp = Math.min(after, mon.hp + (after - before));
    const em = (G.SPECIES[to].em || []).filter((id) => !mon.moves.some((m) => m.id === id));
    // 進化當下等級的招式也一併學
    const lvMoves = G.SPECIES[to].ls.filter(([l]) => l === mon.lv).map(([, id]) => id)
      .filter((id) => !mon.moves.some((m) => m.id === id) && !em.includes(id));
    return { to, newMoves: em.concat(lvMoves) };
  };

  Mon.learn = (mon, id, replaceIdx = -1) => {
    if (mon.moves.some((m) => m.id === id)) return false;
    const slot = { id, pp: G.MOVES[id].pp };
    if (mon.moves.length < 4) mon.moves.push(slot);
    else if (replaceIdx >= 0) mon.moves[replaceIdx] = slot;
    else return false;
    return true;
  };

  Mon.heal = (mon) => {
    mon.hp = Mon.stats(mon).hp;
    mon.status = null;
    mon.slp = 0;
    mon.moves.forEach((m) => (m.pp = G.MOVES[m.id].pp));
  };

  Mon.trainTotal = (mon) => KEYS.reduce((s, k) => s + (mon.train[k] || 0), 0);
})();

// ── js/engine/battle.js ──
// 對戰引擎：產生事件列表交給畫面播放
(function () {
  const U = G.U;
  const zeroSt = () => ({ atk: 0, def: 0, spa: 0, spd: 0, spe: 0 });
  const newVol = () => ({ st: zeroSt(), flinch: false, protect: false, protectChain: 0, dmax: 0, toxN: 0, ff: false, lastMoveId: null });
  const stageMul = (s) => (s >= 0 ? (2 + s) / 2 : 2 / (2 - s));
  const dmaxPow = (p) => (p <= 40 ? 75 : p <= 55 ? 85 : p <= 70 ? 95 : p <= 85 ? 105 : p <= 100 ? 120 : 130);

  const statusImmune = (mon, st, mv) => {
    const t = G.SPECIES[mon.sp].types;
    if (st === 'brn' && t.includes('fire')) return true;
    if (st === 'par' && t.includes('electric')) return true;
    if ((st === 'psn' || st === 'tox') && (t.includes('poison') || t.includes('steel'))) return true;
    if (st === 'frz' && t.includes('ice')) return true;
    if (mv && mv.powder && t.includes('grass')) return true;
    if (mv && mv.cat === 'T' && mv.type === 'electric' && t.includes('ground')) return true;
    return false;
  };

  G.Dmg = {
    stageMul,
    dmaxPow,
    statusImmune,
    // A / D：{ mon, st, dmax, ff, hp, max }
    calc(A, D, mv, o = {}) {
      const am = A.mon, dm = D.mon;
      if (mv.cat === 'T') return { dmg: 0, eff: 1 };
      const ab = dm.ability;
      if (ab === 'levitate' && mv.type === 'ground') return { dmg: 0, eff: 0, immune: 'levitate' };
      if (ab === 'flashfire' && mv.type === 'fire') return { dmg: 0, eff: 0, immune: 'flashfire' };
      if (ab === 'sapsipper' && mv.type === 'grass') return { dmg: 0, eff: 0, immune: 'sapsipper' };
      const eff = G.eff(mv.type, G.SPECIES[dm.sp].types);
      if (eff === 0) return { dmg: 0, eff: 0 };
      let pow = mv.pow;
      if (mv.hex && dm.status) pow *= 2;
      if (mv.facade && am.status) pow *= 2;
      if (A.dmax) pow = dmaxPow(pow);
      const pinch = { overgrow: 'grass', blaze: 'fire', torrent: 'water', swarm: 'bug' }[am.ability];
      if (pinch === mv.type && A.hp <= A.max / 3) pow *= 1.5;
      if (A.ff && mv.type === 'fire') pow *= 1.5;
      if (am.ability === 'toughclaws' && mv.cat === 'P') pow *= 1.3;
      const phys = mv.cat === 'P';
      const ast = G.Mon.stats(am), dst = G.Mon.stats(dm);
      let atk = phys ? ast.atk : ast.spa;
      let def = phys ? dst.def : dst.spd;
      let aS = A.st[phys ? 'atk' : 'spa'], dS = D.st[phys ? 'def' : 'spd'];
      if (o.crit) { aS = Math.max(0, aS); dS = Math.min(0, dS); }
      atk *= stageMul(aS);
      def *= stageMul(dS);
      if (am.ability === 'guts' && am.status && phys) atk *= 1.5;
      const base = Math.floor(Math.floor((Math.floor((2 * am.lv) / 5 + 2) * pow * atk) / def) / 50) + 2;
      let mod = eff;
      if (G.SPECIES[am.sp].types.includes(mv.type)) mod *= 1.5;
      if (o.crit) mod *= 1.5;
      if (am.status === 'brn' && phys && am.ability !== 'guts') mod *= 0.5;
      if (ab === 'thickfat' && (mv.type === 'fire' || mv.type === 'ice')) mod *= 0.5;
      if (ab === 'multiscale' && D.hp >= D.max) mod *= 0.5;
      const roll = o.roll ?? U.rand(85, 100) / 100;
      return { dmg: Math.max(1, Math.floor(base * mod * roll)), eff };
    },
  };

  const STATUS_MSG = {
    brn: (n) => `${n} 被灼傷了！`,
    par: (n) => `${n} 麻痺了！可能會動不了！`,
    psn: (n) => `${n} 中毒了！`,
    tox: (n) => `${n} 中了劇毒！`,
    slp: (n) => `${n} 睡著了！`,
    frz: (n) => `${n} 被凍住了！`,
  };

  class Battle {
    // o: { kind:'wild'|'trainer', pTeam, eTeam, trainer, player:{name,bag}, aiLv, allowDmax }
    constructor(o) {
      this.kind = o.kind;
      this.trainer = o.trainer || null;
      this.player = o.player;
      this.aiLv = o.aiLv ?? 1;
      this.allowDmax = !!o.allowDmax;
      this.S = {
        p: { team: o.pTeam, idx: Math.max(0, o.pTeam.findIndex((m) => m.hp > 0)), vol: newVol(), dmaxUsed: !this.allowDmax },
        e: { team: o.eTeam, idx: 0, vol: newVol(), dmaxUsed: !(this.trainer && this.trainer.dmax), items: Object.assign({}, (this.trainer && this.trainer.items) || {}) },
      };
      this.ev = [];
      this.over = false;
      this.result = null;
      this.need = null;
      this.turnNo = 0;
      this.partic = {};
      this.learnQ = [];
      this.seen = new Set();
      this.money = 0;
      this.runTries = 0;
      this.lastSwitch = { p: -9, e: -9 };
      this.acts = null;
      this.moved = { p: false, e: false };
      this.downed = new Set();
    }

    // ── 基本查詢 ──
    foe(side) { return side === 'p' ? 'e' : 'p'; }
    mon(side) { const s = this.S[side]; return s.team[s.idx]; }
    nm(side) {
      const n = G.Mon.name(this.mon(side));
      if (side === 'p') return n;
      return this.kind === 'wild' ? `野生的${n}` : `對手的${n}`;
    }
    maxHp(side) {
      const base = G.Mon.stats(this.mon(side)).hp;
      return this.S[side].vol.dmax > 0 ? Math.floor(base * 1.5) : base;
    }
    effSpeed(side) {
      const m = this.mon(side);
      let s = G.Mon.stats(m).spe * stageMul(this.S[side].vol.st.spe);
      if (m.status === 'par') s *= 0.5;
      return s;
    }
    bt(side) {
      const V = this.S[side].vol, m = this.mon(side);
      return { mon: m, st: V.st, dmax: V.dmax > 0, ff: V.ff, hp: m.hp, max: this.maxHp(side) };
    }
    view(side) {
      const m = this.mon(side), V = this.S[side].vol;
      return {
        uid: m.uid, sp: m.sp, name: G.Mon.name(m), lv: m.lv, hp: Math.max(0, m.hp), max: this.maxHp(side),
        status: m.status, st: Object.assign({}, V.st), dmax: V.dmax, types: G.SPECIES[m.sp].types,
        exp: side === 'p' ? G.Mon.expProgress(m) : 0, friend: m.friend,
      };
    }
    speedOrder() {
      const a = this.effSpeed('p'), b = this.effSpeed('e');
      return a > b || (a === b && Math.random() < 0.5) ? ['p', 'e'] : ['e', 'p'];
    }
    prio(side) {
      const a = this.acts[side];
      if (a.type !== 'move' || a.idx < 0) return 0;
      return G.MOVES[this.mon(side).moves[a.idx].id].pri;
    }

    // ── 事件 ──
    emit(e) { this.ev.push(e); }
    msg(text) { this.ev.push({ t: 'msg', text }); }
    emitView(t, side) { this.emit({ t, side, view: this.view(side) }); }

    // ── 開場 ──
    start() {
      this.ev = [];
      const e = this.mon('e');
      this.seen.add(e.sp);
      if (this.kind === 'wild') {
        this.emit({ t: 'send', side: 'e', view: this.view('e'), wild: true });
        this.msg(`野生的 ${G.Mon.name(e)} 跳出來了！`);
      } else {
        this.emit({ t: 'trainer', on: true });
        this.msg(`${this.trainer.cls} ${this.trainer.name} 想要和你對戰！`);
        if (this.trainer.intro) this.msg(`${this.trainer.name}：「${this.trainer.intro}」`);
        this.emit({ t: 'trainer', on: false });
        this.msg(`${this.trainer.name} 派出了 ${G.Mon.name(e)}！`);
        this.emit({ t: 'send', side: 'e', view: this.view('e') });
      }
      this.msg(`去吧！${G.Mon.name(this.mon('p'))}！`);
      this.emit({ t: 'send', side: 'p', view: this.view('p') });
      this.markPartic();
      for (const s of this.speedOrder()) this.entryAbility(s);
      return this.ev;
    }

    markPartic() {
      const e = this.mon('e'), p = this.mon('p');
      if (e.hp > 0 && p.hp > 0) (this.partic[e.uid] = this.partic[e.uid] || new Set()).add(p.uid);
    }

    entryAbility(side) {
      const m = this.mon(side);
      if (m.hp <= 0) return;
      if (m.ability === 'intimidate' && this.mon(this.foe(side)).hp > 0) {
        this.msg(`${this.nm(side)} 的「威嚇」讓對手害怕了！`);
        this.changeStages(this.foe(side), { atk: -1 }, side);
      }
    }

    // ── 一回合 ──
    turn(pAct) {
      this.ev = [];
      if (this.over) return this.ev;
      this.turnNo++;
      this.markPartic();
      const eAct = this.kind === 'wild' ? G.AI.wild(this) : G.AI.choose(this);
      this.acts = { p: pAct, e: eAct };
      this.moved = { p: false, e: false };
      if (pAct.type === 'switch') this.lastSwitch.p = this.turnNo;

      // 先處理換人、道具、丟球、逃跑
      for (const side of ['p', 'e']) {
        if (this.over) return this.ev;
        const a = this.acts[side];
        if (a.type === 'run') this.tryRun();
        else if (a.type === 'switch') { this.doSwitch(side, a.idx); this.moved[side] = true; }
        else if (a.type === 'item') { side === 'p' ? this.useItemP(a) : this.useItemE(a.item); this.moved[side] = true; }
        else if (a.type === 'ball') { this.throwBall(a.item); this.moved[side] = true; }
      }
      if (this.over) return this.ev;

      // 星光巨大化
      for (const side of ['p', 'e']) {
        const a = this.acts[side];
        if (a.type === 'move' && a.dmax && !this.S[side].dmaxUsed && this.mon(side).hp > 0) this.dynamax(side);
      }

      // 出招順序：先制度 → 速度
      const movers = ['p', 'e'].filter((s) => this.acts[s].type === 'move');
      movers.sort((x, y) => this.prio(y) - this.prio(x) || this.effSpeed(y) - this.effSpeed(x) || Math.random() - 0.5);
      for (const side of movers) {
        if (this.over) break;
        if (this.mon(side).hp <= 0) continue;
        let idx = this.acts[side].idx;
        const m = this.mon(side);
        if (idx >= 0 && (!m.moves[idx] || m.moves[idx].pp <= 0)) idx = -1;
        if (idx < 0 && m.moves.some((x) => x.pp > 0)) idx = m.moves.findIndex((x) => x.pp > 0);
        if (idx < 0) this.msg(`${this.nm(side)} 已經沒有可以使用的招式了！`);
        this.useMove(side, idx);
        this.moved[side] = true;
      }
      if (!this.over) this.endTurn();
      if (!this.over) this.resolveFaints();
      return this.ev;
    }

    forceSwitch(idx) {
      this.ev = [];
      this.need = null;
      this.switchIn('p', idx);
      return this.ev;
    }

    // ── 招式 ──
    useMove(side, idx) {
      const S = this.S[side], m = this.mon(side), n = this.nm(side);
      const tSide = this.foe(side), T = this.S[tSide], t = this.mon(tSide), tn = this.nm(tSide);
      const slot = idx >= 0 ? m.moves[idx] : null;
      const mv = slot ? G.MOVES[slot.id] : G.MOVES.struggle;

      if (m.status === 'frz') {
        if (U.chance(20)) { m.status = null; this.msg(`${n} 身上的冰融化了！`); this.emitView('status', side); }
        else { this.emit({ t: 'fx', side, kind: 'frz' }); this.msg(`${n} 被凍住了，動不了！`); return; }
      }
      if (m.status === 'slp') {
        m.slp--;
        if (m.slp <= 0) { m.status = null; this.msg(`${n} 醒過來了！`); this.emitView('status', side); }
        else { this.emit({ t: 'fx', side, kind: 'slp' }); this.msg(`${n} 正在呼呼大睡……`); return; }
      }
      if (S.vol.flinch) { this.msg(`${n} 畏縮了，沒辦法行動！`); return; }
      if (m.status === 'par' && U.chance(25)) { this.emit({ t: 'fx', side, kind: 'par' }); this.msg(`${n} 身體麻痺，動不了！`); return; }

      if (slot) slot.pp = Math.max(0, slot.pp - 1);
      S.vol.lastMoveId = mv.id;
      const dm = S.vol.dmax > 0;
      this.msg(`${n} 使出了${dm && mv.cat !== 'T' ? '巨大' : ''}「${mv.name}」！`);

      if (mv.protect) {
        if (U.chance(100 / Math.pow(3, S.vol.protectChain))) {
          S.vol.protect = true;
          S.vol.protectChain++;
          this.emit({ t: 'fx', side, kind: 'protect' });
          this.msg(`${n} 守住了自己！`);
        } else {
          S.vol.protectChain = 0;
          this.msg('但是失敗了！');
        }
        return;
      }
      S.vol.protectChain = 0;

      const hitsFoe = mv.cat !== 'T' || mv.st || mv.foe;
      if (hitsFoe) {
        if (t.hp <= 0) { this.msg('但是沒有目標……'); return; }
        if (mv.sucker) {
          const ta = this.acts && this.acts[tSide];
          const tm = ta && ta.type === 'move' ? (ta.idx >= 0 ? G.MOVES[t.moves[ta.idx].id] : G.MOVES.struggle) : null;
          if (this.moved[tSide] || !tm || tm.cat === 'T') { this.msg('但是失敗了！'); return; }
        }
        if (T.vol.protect) {
          this.emit({ t: 'atk', side, type: mv.type, cat: mv.cat, blocked: true });
          this.msg(`${tn} 守住了攻擊！`);
          return;
        }
        const acc = dm && mv.cat !== 'T' ? null : mv.acc;
        if (acc !== null && !U.chance(acc)) {
          this.emit({ t: 'atk', side, type: mv.type, cat: mv.cat, miss: true });
          this.msg(mv.cat === 'T' ? '但是沒有命中！' : `${tn} 閃開了攻擊！`);
          return;
        }
      }
      if (mv.cat === 'T') return this.statusMove(side, mv);

      const A = this.bt(side), D = this.bt(tSide);
      const pre = G.Dmg.calc(A, D, mv, { roll: 1 });
      if (pre.immune) {
        this.emit({ t: 'atk', side, type: mv.type, cat: mv.cat, blocked: true });
        this.handleImmune(tSide, pre.immune);
        return;
      }
      if (pre.eff === 0) {
        this.emit({ t: 'atk', side, type: mv.type, cat: mv.cat, blocked: true });
        this.msg(`對 ${tn} 好像沒有效果……`);
        return;
      }
      const cs = (mv.crit ? 1 : 0) + (side === 'p' && m.friend >= 70 ? 1 : 0);
      const crit = U.chance([4.17, 12.5, 50, 100][Math.min(cs, 3)]);
      const r = G.Dmg.calc(A, D, mv, { crit });
      this.emit({ t: 'atk', side, type: mv.type, cat: mv.cat, dmax: dm });
      let dmg = Math.min(r.dmg, t.hp);
      const tmax = this.maxHp(tSide);
      let endured = null;
      if (dmg >= t.hp && t.hp > 1) {
        if (t.ability === 'sturdy' && t.hp === tmax) { dmg = t.hp - 1; endured = 'sturdy'; }
        else if (tSide === 'p' && t.friend >= 50 && U.chance(t.friend >= 90 ? 25 : 12)) { dmg = t.hp - 1; endured = 'friend'; }
      }
      t.hp -= dmg;
      this.emit({ t: 'hit', side: tSide, eff: r.eff, crit, dmg, type: mv.type });
      this.emitView('hp', tSide);
      if (crit) this.msg('擊中要害了！');
      if (r.eff > 1) this.msg(r.eff >= 4 ? '效果超級絕佳！！' : '效果絕佳！');
      else if (r.eff < 1) this.msg('效果不太好……');
      if (endured === 'sturdy') this.msg(`${tn} 靠著「結實」撐住了！`);
      if (endured === 'friend') this.msg(`${tn} 為了不讓${this.player.name}傷心，咬緊牙關撐住了！`);

      if (mv.drain && dmg > 0 && m.hp > 0) this.healHp(side, Math.max(1, Math.floor(dmg * mv.drain)), `${tn} 的體力被吸走了！`);
      if (mv.recoil && dmg > 0 && m.hp > 0) {
        const rc = Math.max(1, Math.floor((mv.id === 'struggle' ? this.maxHp(side) : dmg) * mv.recoil));
        m.hp = Math.max(0, m.hp - rc);
        this.emitView('hp', side);
        this.msg(`${n} 受到了反作用力的傷害！`);
      }
      if (t.hp > 0) {
        if (t.status === 'frz' && mv.type === 'fire') { t.status = null; this.emitView('status', tSide); this.msg(`${tn} 身上的冰融化了！`); }
        if (mv.st && U.chance(mv.st[1])) this.tryStatus(tSide, mv.st[0], false, mv);
        if (mv.foe && (!mv.foeCh || U.chance(mv.foeCh))) this.changeStages(tSide, mv.foe, side);
        if (mv.fl && !this.moved[tSide] && !T.vol.dmax && U.chance(mv.fl)) T.vol.flinch = true;
        if (mv.cat === 'P' && m.hp > 0) this.contactAbility(side, tSide);
      }
      if (mv.self && m.hp > 0 && (!mv.selfCh || U.chance(mv.selfCh))) this.changeStages(side, mv.self, side);
      if (t.hp <= 0) {
        this.faint(tSide);
        if (m.ability === 'moxie' && m.hp > 0 && !this.over) {
          this.msg(`${n} 的「自信過度」發動了！`);
          this.changeStages(side, { atk: 1 }, side);
        }
      }
      if (m.hp <= 0) this.faint(side);
    }

    statusMove(side, mv) {
      const m = this.mon(side), n = this.nm(side), tSide = this.foe(side);
      this.emit({ t: 'atk', side, type: mv.type, cat: 'T', self: !!(mv.self || mv.heal) && !mv.st && !mv.foe });
      if (mv.heal) {
        const mx = this.maxHp(side);
        if (m.hp >= mx) this.msg('但是 HP 已經是滿的了！');
        else this.healHp(side, Math.floor(mx * mv.heal), `${n} 回復了體力！`);
      }
      if (mv.self) this.changeStages(side, mv.self, side);
      if (mv.st) this.tryStatus(tSide, mv.st[0], true, mv);
      if (mv.foe) this.changeStages(tSide, mv.foe, side);
    }

    handleImmune(tSide, kind) {
      const tn = this.nm(tSide);
      if (kind === 'levitate') this.msg(`${tn} 浮在空中，地面招式打不到！`);
      if (kind === 'flashfire') {
        this.S[tSide].vol.ff = true;
        this.msg(`${tn} 的「引火」把火焰吸收了！火屬性招式變強了！`);
      }
      if (kind === 'sapsipper') {
        this.msg(`${tn} 的「食草」把招式吃掉了！`);
        this.changeStages(tSide, { atk: 1 }, tSide);
      }
    }

    contactAbility(aSide, dSide) {
      const a = this.mon(aSide), d = this.mon(dSide);
      const dn = this.nm(dSide), an = this.nm(aSide);
      const abName = G.ABILITIES[d.ability] ? G.ABILITIES[d.ability].name : '';
      if (d.ability === 'static' && !a.status && U.chance(30) && !statusImmune(a, 'par')) {
        this.msg(`${dn} 的「${abName}」電到了 ${an}！`);
        this.tryStatus(aSide, 'par');
      } else if (d.ability === 'poisonpoint' && !a.status && U.chance(30) && !statusImmune(a, 'psn')) {
        this.msg(`${dn} 的「${abName}」刺到了 ${an}！`);
        this.tryStatus(aSide, 'psn');
      } else if (d.ability === 'effectspore' && !a.status && U.chance(30)) {
        const st = U.pick(['psn', 'par', 'slp']);
        if (!statusImmune(a, st) && !G.SPECIES[a.sp].types.includes('grass')) {
          this.msg(`${dn} 撒出了孢子！`);
          this.tryStatus(aSide, st);
        }
      } else if (d.ability === 'roughskin' && a.hp > 0) {
        const dmg = Math.max(1, Math.floor(this.maxHp(aSide) / 8));
        a.hp = Math.max(0, a.hp - dmg);
        this.emitView('hp', aSide);
        this.msg(`${an} 被 ${dn} 的「粗糙皮膚」刮傷了！`);
      }
    }

    tryStatus(side, st, fromMove = false, mv = null) {
      const m = this.mon(side), n = this.nm(side);
      if (m.hp <= 0) return false;
      if (m.status) {
        if (fromMove) this.msg(m.status === st ? `${n} 已經${G.STATUS_INFO[st].name}了！` : '但是失敗了！');
        return false;
      }
      if (statusImmune(m, st, mv)) {
        if (fromMove) this.msg(`對 ${n} 好像沒有效果……`);
        return false;
      }
      m.status = st;
      if (st === 'slp') m.slp = U.rand(2, 4);
      if (st === 'tox') this.S[side].vol.toxN = 0;
      this.emit({ t: 'fx', side, kind: st });
      this.emitView('status', side);
      this.msg(STATUS_MSG[st](n));
      return true;
    }

    changeStages(side, ch, src) {
      const m = this.mon(side), n = this.nm(side), st = this.S[side].vol.st;
      if (m.hp <= 0) return;
      for (const [k, d] of Object.entries(ch)) {
        if (d < 0 && src !== side && m.ability === 'clearbody') {
          this.msg(`${n} 的「恆淨之軀」讓能力不會被降低！`);
          continue;
        }
        const before = st[k];
        st[k] = U.clamp(st[k] + d, -6, 6);
        const real = st[k] - before;
        const sn = G.STAT_NAMES[k];
        if (real === 0) {
          this.msg(`${n} 的${sn}已經${d > 0 ? '不能再提升' : '不能再降低'}了！`);
          continue;
        }
        this.emit({ t: 'stat', side, stat: k, delta: real, view: this.view(side) });
        const word = Math.abs(real) >= 3 ? '巨幅' : Math.abs(real) === 2 ? '大幅' : '';
        this.msg(`${n} 的${sn}${word}${real > 0 ? '提升' : '降低'}了！`);
      }
    }

    healHp(side, amt, text) {
      const m = this.mon(side), mx = this.maxHp(side);
      m.hp = Math.min(mx, m.hp + amt);
      this.emit({ t: 'fx', side, kind: 'heal' });
      this.emitView('hp', side);
      if (text) this.msg(text);
    }

    residual(side, amt, text) {
      const m = this.mon(side);
      m.hp = Math.max(0, m.hp - amt);
      this.emit({ t: 'fx', side, kind: m.status || 'hurt' });
      this.emitView('hp', side);
      this.msg(text);
    }

    // ── 回合結束 ──
    endTurn() {
      for (const side of this.speedOrder()) {
        const m = this.mon(side);
        if (m.hp <= 0) continue;
        const n = this.nm(side), mx = this.maxHp(side), V = this.S[side].vol;
        if (m.status === 'brn') this.residual(side, Math.max(1, Math.floor(mx / 16)), `${n} 受到灼傷的傷害！`);
        else if (m.status === 'psn') this.residual(side, Math.max(1, Math.floor(mx / 8)), `${n} 受到毒的傷害！`);
        else if (m.status === 'tox') {
          V.toxN = Math.min(15, V.toxN + 1);
          this.residual(side, Math.max(1, Math.floor((mx * V.toxN) / 16)), `${n} 受到劇毒的傷害！`);
        }
        if (m.hp <= 0) { this.faint(side); continue; }
        if (m.ability === 'icebody' && m.hp < mx) this.healHp(side, Math.max(1, Math.floor(mx / 16)), `${n} 的「冰晶之軀」回復了一點 HP！`);
        if (m.ability === 'speedboost') this.changeStages(side, { spe: 1 }, side);
        if (side === 'p' && m.status && m.friend >= 90 && U.chance(20)) {
          m.status = null;
          this.emitView('status', side);
          this.msg(`${n} 不想讓${this.player.name}擔心，自己治好了異常狀態！`);
        }
        if (V.dmax > 0) {
          V.dmax--;
          if (V.dmax === 0) this.endDmax(side);
        }
      }
      for (const s of ['p', 'e']) {
        this.S[s].vol.flinch = false;
        this.S[s].vol.protect = false;
      }
    }

    faint(side) {
      const m = this.mon(side);
      if (this.downed.has(m.uid)) return;
      this.downed.add(m.uid);
      m.hp = 0;
      if (this.S[side].vol.dmax) this.endDmax(side, true);
      m.status = null;
      m.slp = 0;
      this.emit({ t: 'faint', side });
      this.msg(`${this.nm(side)} 倒下了！`);
      if (side === 'e') this.giveExp(m);
      else m.friend = Math.max(0, m.friend - 1);
    }

    resolveFaints() {
      const pDown = this.mon('p').hp <= 0, eDown = this.mon('e').hp <= 0;
      const pAlive = this.S.p.team.some((m) => m.hp > 0);
      const eAlive = this.S.e.team.some((m) => m.hp > 0);
      if (eDown && !eAlive) return this.win();
      if (pDown && !pAlive) return this.lose();
      if (eDown) this.switchIn('e', G.AI.pickNext(this));
      if (pDown) this.need = 'switch';
    }

    win() {
      this.over = true;
      this.result = 'win';
      if (this.trainer) {
        this.emit({ t: 'trainer', on: true });
        this.msg(`打敗了${this.trainer.cls} ${this.trainer.name}！`);
        if (this.trainer.lose) this.msg(`${this.trainer.name}：「${this.trainer.lose}」`);
        const top = Math.max(...this.S.e.team.map((m) => m.lv));
        this.money = (this.trainer.money || 40) * top;
        this.msg(`${this.player.name} 獲得了 $${this.money} 獎金！`);
      }
    }

    lose() {
      this.over = true;
      this.result = 'lose';
      this.msg(`${this.player.name} 已經沒有可以戰鬥的萌獸了……`);
    }

    // ── 經驗值 ──
    giveExp(em) {
      const base = G.SPECIES[em.sp].exp, L = em.lv;
      const part = this.partic[em.uid] || new Set([this.mon('p').uid]);
      const later = [];
      let shared = false;
      for (const pm of this.S.p.team) {
        if (pm.hp <= 0 || pm.lv >= G.MAX_LV) continue;
        const Lp = pm.lv;
        let e = ((base * L) / 5) * Math.pow((2 * L + 10) / (L + Lp + 10), 2.5) + 1;
        if (this.kind === 'trainer') e *= 1.5;
        e *= G.EXP_MULT;
        const isPart = part.has(pm.uid);
        if (!isPart) e *= 0.5;
        e = Math.max(1, Math.floor(e));
        const name = G.Mon.name(pm);
        const active = pm === this.mon('p');
        const out = [];
        if (isPart) this.msg(`${name} 獲得了 ${e} 點經驗值！`);
        else shared = true;
        const ups = G.Mon.addExp(pm, e);
        if (active) this.emit({ t: 'exp', side: 'p', levels: ups.length, view: this.view('p') });
        for (const u of ups) {
          if (active) out.push({ t: 'levelup', side: 'p', lv: u.lv });
          out.push({ t: 'msg', text: `${name} 升到了 Lv.${u.lv}！` });
          for (const id of u.newMoves) {
            if (pm.moves.length < 4) {
              G.Mon.learn(pm, id);
              out.push({ t: 'msg', text: `${name} 學會了「${G.MOVES[id].name}」！` });
            } else if (!this.learnQ.some((q) => q.uid === pm.uid && q.id === id)) {
              this.learnQ.push({ uid: pm.uid, id });
            }
          }
        }
        if (active && ups.length) out.push({ t: 'hp', side: 'p', view: this.view('p') });
        if (isPart) out.forEach((x) => this.emit(x));
        else later.push(...out);
      }
      if (shared) this.msg('隊伍裡的其他夥伴也一起獲得了經驗值！');
      later.forEach((x) => this.emit(x));
    }

    // ── 星光巨大化 ──
    dynamax(side) {
      const S = this.S[side], m = this.mon(side), n = this.nm(side);
      S.dmaxUsed = true;
      if (side === 'p') this.msg(`${this.player.name} 把星光的力量傳給了 ${n}！`);
      else this.msg(`${this.trainer.name}：「讓你見識我的全力吧！」`);
      S.vol.dmax = 3;
      m.hp = Math.floor(m.hp * 1.5);
      this.emit({ t: 'dmax', side, on: true, view: this.view(side) });
      this.msg(`${n} 星光巨大化了！`);
    }

    endDmax(side, silent) {
      const m = this.mon(side), V = this.S[side].vol;
      V.dmax = 0;
      if (m.hp > 0) m.hp = Math.max(1, Math.ceil(m.hp / 1.5));
      this.emit({ t: 'dmax', side, on: false, view: this.view(side) });
      if (!silent) this.msg(`${this.nm(side)} 恢復成原本的大小了！`);
    }

    // ── 換人 ──
    switchOut(side) {
      const S = this.S[side], m = this.mon(side);
      if (S.vol.dmax) this.endDmax(side, true);
      if (m.ability === 'regenerator' && m.hp > 0) m.hp = Math.min(G.Mon.stats(m).hp, m.hp + Math.floor(G.Mon.stats(m).hp / 3));
      this.msg(side === 'p' ? `${G.Mon.name(m)}，回來吧！` : `${this.trainer.name} 收回了 ${G.Mon.name(m)}！`);
      this.emit({ t: 'recall', side });
    }

    switchIn(side, idx) {
      const S = this.S[side];
      S.idx = idx;
      S.vol = newVol();
      const m = this.mon(side);
      if (side === 'e') {
        this.seen.add(m.sp);
        this.msg(`${this.trainer ? this.trainer.name : ''} 派出了 ${G.Mon.name(m)}！`);
      } else {
        this.msg(`就決定是你了！${G.Mon.name(m)}！`);
      }
      this.emit({ t: 'send', side, view: this.view(side) });
      this.markPartic();
      this.entryAbility(side);
    }

    doSwitch(side, idx) {
      this.switchOut(side);
      this.switchIn(side, idx);
    }

    // ── 道具 / 捕捉 / 逃跑 ──
    useItemP(a) {
      const it = G.ITEMS[a.item], m = this.S.p.team[a.target], n = G.Mon.name(m);
      this.player.bag[a.item] = Math.max(0, (this.player.bag[a.item] || 0) - 1);
      this.msg(`${this.player.name} 使用了 ${it.name}！`);
      const active = a.target === this.S.p.idx;
      const mx = active ? this.maxHp('p') : G.Mon.stats(m).hp;
      if (it.kind === 'heal') {
        const before = m.hp;
        m.hp = Math.min(mx, m.hp + it.heal);
        if (active) { this.emit({ t: 'fx', side: 'p', kind: 'heal' }); this.emitView('hp', 'p'); }
        this.msg(`${n} 回復了 ${m.hp - before} HP！`);
      } else if (it.kind === 'cure') {
        m.status = null;
        m.slp = 0;
        if (active) this.emitView('status', 'p');
        this.msg(`${n} 的異常狀態治好了！`);
      } else if (it.kind === 'revive') {
        m.hp = Math.floor(G.Mon.stats(m).hp / 2);
        this.downed.delete(m.uid);
        this.msg(`${n} 恢復了精神！`);
      }
    }

    useItemE(item) {
      const it = G.ITEMS[item], m = this.mon('e');
      this.msg(`${this.trainer.name} 使用了 ${it.name}！`);
      const before = m.hp;
      m.hp = Math.min(this.maxHp('e'), m.hp + it.heal);
      this.emit({ t: 'fx', side: 'e', kind: 'heal' });
      this.emitView('hp', 'e');
      this.msg(`${this.nm('e')} 回復了 ${m.hp - before} HP！`);
    }

    throwBall(item) {
      const it = G.ITEMS[item];
      this.player.bag[item] = Math.max(0, (this.player.bag[item] || 0) - 1);
      this.msg(`${this.player.name} 丟出了 ${it.name}！`);
      if (this.kind !== 'wild') {
        this.emit({ t: 'ball', item, shakes: -1, ok: false });
        this.msg('訓練家把球彈開了！不可以搶別人的萌獸喔！');
        return;
      }
      const e = this.mon('e'), mx = this.maxHp('e'), rate = G.SPECIES[e.sp].rate;
      const stMul = e.status === 'slp' || e.status === 'frz' ? 2.5 : e.status ? 1.5 : 1;
      const a = (((3 * mx - 2 * e.hp) * rate * it.mul) / (3 * mx)) * stMul;
      const p = Math.min(1, a / 255);
      const ok = Math.random() < p;
      let shakes = 3;
      if (!ok) {
        const q = Math.pow(p, 0.25);
        shakes = 0;
        while (shakes < 2 && Math.random() < q) shakes++;
      }
      this.emit({ t: 'ball', item, shakes, ok });
      if (ok) {
        this.msg(`太好了！抓到 ${G.Mon.name(e)} 了！`);
        this.over = true;
        this.result = 'caught';
        this.caught = e;
      } else {
        this.msg([`${G.Mon.name(e)} 從球裡跳出來了！`, '哎呀！還以為抓到了！', '啊！就差一點點！'][shakes]);
      }
    }

    // 對戰結束後還原巨大化等暫時狀態
    cleanup() {
      for (const side of ['p', 'e']) {
        const V = this.S[side].vol, m = this.mon(side);
        if (V.dmax > 0) {
          V.dmax = 0;
          if (m.hp > 0) m.hp = Math.min(G.Mon.stats(m).hp, Math.max(1, Math.ceil(m.hp / 1.5)));
        }
      }
      for (const m of this.S.p.team) m.hp = Math.min(m.hp, G.Mon.stats(m).hp);
    }

    tryRun() {
      if (this.kind !== 'wild') { this.msg('不能從訓練家對戰中逃走！'); return; }
      this.runTries++;
      const ps = this.effSpeed('p'), es = this.effSpeed('e');
      const odds = ps >= es ? 256 : Math.floor((ps * 128) / es) + 30 * this.runTries;
      if (Math.random() * 256 < odds) {
        this.msg('順利逃走了！');
        this.over = true;
        this.result = 'run';
      } else this.msg('逃不掉！');
    }
  }

  G.Battle = Battle;
})();
