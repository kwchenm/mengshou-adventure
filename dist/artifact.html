// 對手 AI：0 = 輕鬆、1 = 標準、2 = 挑戰
(function () {
  const U = G.U;
  const AI = (G.AI = {});

  const bench = (b, side, i) => {
    const m = b.S[side].team[i];
    return { mon: m, st: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0 }, dmax: false, ff: false, hp: m.hp, max: G.Mon.stats(m).hp };
  };

  // 預期傷害佔對方「目前 HP」的比例（>= 1 代表大概能打倒）
  AI.moveValue = (A, D, mv) => {
    if (mv.cat === 'T') return 0;
    const r = G.Dmg.calc(A, D, mv, { roll: 0.925 });
    if (r.immune || r.eff === 0) return 0;
    const acc = A.dmax || mv.acc === null ? 1 : mv.acc / 100;
    return (r.dmg / Math.max(1, D.hp)) * acc;
  };

  AI.best = (A, D) => {
    let best = { v: 0, idx: -1 };
    A.mon.moves.forEach((s, i) => {
      if (s.pp <= 0) return;
      const v = AI.moveValue(A, D, G.MOVES[s.id]);
      if (v > best.v) best = { v, idx: i };
    });
    return best;
  };

  AI.scoreMove = (b, me, foe, mv, c) => {
    const fm = foe.mon;
    if (mv.cat !== 'T') {
      const v = AI.moveValue(me, foe, mv);
      if (v <= 0) return -60;
      let sc = Math.min(v, 1) * 100;
      if (v >= 1) {
        sc = 150 + (mv.acc ?? 100) / 10;
        if (mv.pri > 0 && c.foeSpe >= c.meSpe) sc += 40;
      }
      if (mv.recoil && c.myHpPct < 0.3) sc -= 10;
      if (mv.self && Object.values(mv.self).some((d) => d < 0) && v < 1) sc -= 8;
      if (mv.st && !fm.status && mv.st[1] >= 30) sc += 6;
      if (mv.sucker) sc -= 18;
      return sc;
    }
    if (mv.protect) {
      if (b.S.e.vol.lastMoveId === 'protect') return -40;
      return b.S.p.vol.dmax ? 70 : fm.status === 'tox' || fm.status === 'psn' || fm.status === 'brn' ? 30 : 6;
    }
    if (mv.heal) {
      if (c.myHpPct > 0.75) return -30;
      if (c.myHpPct < 0.45 && c.foeBest.v < 0.5) return 95;
      return c.myHpPct < 0.55 ? 50 : 10;
    }
    if (mv.st) {
      const st = mv.st[0];
      if (fm.status || G.Dmg.statusImmune(fm, st, mv)) return -40;
      let sc = 50;
      const fs = G.Mon.stats(fm);
      if (st === 'slp') sc = 78;
      if (st === 'par') sc = c.foeSpe > c.meSpe ? 74 : 45;
      if (st === 'brn') sc = fs.atk > fs.spa ? 76 : 30;
      if (st === 'tox' || st === 'psn') sc = 54;
      if (c.foeBest.v >= 1 && c.foeSpe > c.meSpe) sc -= 35;
      return sc * ((mv.acc ?? 100) / 100);
    }
    if (mv.self) {
      const keys = Object.keys(mv.self);
      if (keys.every((k) => b.S.e.vol.st[k] >= 2)) return -20;
      if (c.myHpPct > 0.6 && c.foeBest.v < 0.35) return 88;
      if (c.myHpPct > 0.5 && c.foeBest.v < 0.5) return 55;
      return 4;
    }
    if (mv.foe) {
      const k = Object.keys(mv.foe)[0];
      if (b.S.p.vol.st[k] <= -2) return -10;
      const fs = G.Mon.stats(fm);
      if (k === 'atk' && fs.atk < fs.spa) return 4;
      return c.foeBest.v >= 0.5 ? 18 : 30;
    }
    return 0;
  };

  AI.choose = (b) => {
    const lvl = b.aiLv;
    const me = b.bt('e'), foe = b.bt('p');
    const m = me.mon;
    const usable = m.moves.map((s, i) => ({ s, i, mv: G.MOVES[s.id] })).filter((x) => x.s.pp > 0);
    if (!usable.length) return { type: 'move', idx: -1 };
    const meSpe = b.effSpeed('e'), foeSpe = b.effSpeed('p');
    const foeBest = AI.best(foe, me);
    const myBest = AI.best(me, foe);
    const myHpPct = m.hp / me.max;
    const alive = b.S.e.team.filter((x) => x.hp > 0).length;

    // 1. 補血道具
    const items = b.S.e.items || {};
    const healItem = ['hyperpotion', 'superpotion', 'potion'].find((k) => items[k] > 0);
    if (lvl >= 1 && healItem && myHpPct < 0.3 && !(myBest.v >= 1 && meSpe > foeSpe) && Math.random() < (lvl >= 2 ? 0.9 : 0.6)) {
      items[healItem]--;
      return { type: 'item', item: healItem };
    }

    // 2. 屬性不利時換人
    if (lvl >= 1 && b.kind === 'trainer' && alive > 1 && b.turnNo - b.lastSwitch.e > 2 && !b.S.e.vol.dmax) {
      if (foeBest.v >= 0.8 && myBest.v < 0.45 && !(myBest.v >= 1 && meSpe > foeSpe)) {
        let pick = null;
        b.S.e.team.forEach((cm, i) => {
          if (i === b.S.e.idx || cm.hp <= 0) return;
          const C = bench(b, 'e', i);
          const threat = AI.best(foe, C).v;
          const off = AI.best(C, foe).v;
          const score = off - threat;
          if (threat < 0.5 && (!pick || score > pick.score)) pick = { i, score };
        });
        if (pick && Math.random() < (lvl >= 2 ? 0.75 : 0.35)) {
          b.lastSwitch.e = b.turnNo;
          return { type: 'switch', idx: pick.i };
        }
      }
    }

    // 3. 招式評分
    const c = { meSpe, foeSpe, foeBest, myHpPct };
    const scored = usable.map((x) => ({ x, sc: AI.scoreMove(b, me, foe, x.mv, c) + Math.random() * [45, 18, 6][lvl] }));
    let pick;
    if (lvl === 0 && Math.random() < 0.35) pick = U.pick(scored);
    else pick = scored.sort((a, z) => z.sc - a.sc)[0];
    const act = { type: 'move', idx: pick.x.i };

    // 4. 王牌或最後一隻時使用星光巨大化
    if (!b.S.e.dmaxUsed && (b.S.e.idx === b.S.e.team.length - 1 || alive === 1)) act.dmax = true;
    return act;
  };

  // 野生萌獸：隨機出招，但偏好攻擊招式
  AI.wild = (b) => {
    const m = b.mon('e');
    const usable = m.moves.map((s, i) => ({ s, i, mv: G.MOVES[s.id] })).filter((x) => x.s.pp > 0);
    if (!usable.length) return { type: 'move', idx: -1 };
    const pick = U.weighted(usable.map((x) => [x, x.mv.cat === 'T' ? 1 : 3]));
    return { type: 'move', idx: pick.i };
  };

  // 訓練家的下一隻
  AI.pickNext = (b) => {
    const team = b.S.e.team;
    const alive = team.map((m, i) => i).filter((i) => team[i].hp > 0);
    if (b.aiLv === 0 || alive.length === 1) return alive[0];
    const foe = b.bt('p');
    let best = null;
    for (const i of alive) {
      const C = bench(b, 'e', i);
      let sc = AI.best(C, foe).v - AI.best(foe, C).v * 0.8;
      if (i === team.length - 1 && alive.length > 1) sc -= 0.6; // 王牌留到最後
      if (!best || sc > best.sc) best = { i, sc };
    }
    return best.i;
  };
})();

// ── js/game.js ──
// 遊戲進度與流程
(function () {
  const U = G.U;
  const KEY = 'mengshou-adventure-save-v1';

  G.PLAYER_LOOKS = [
    { hair: 'pony', hc: '#6B3E26', outfit: '#FF7AA8', acc: '#FFD23F' },
    { hair: 'long', hc: '#2E2238', outfit: '#8B5CF6' },
    { hair: 'bun', hc: '#E8A04B', outfit: '#36CF9C' },
    { hair: 'cap', acc: '#FF5D5D', outfit: '#4F8EF0' },
  ];
  G.PROF = { name: '橡果博士', look: { hair: 'old', outfit: '#8FB8D8', glasses: true, coat: true, beard: true, skin: '#F6D3B5' } };

  const Game = (G.Game = { state: null });

  Game.newGame = (name, diff, look) => {
    Game.state = {
      v: 1, name: name || '小星', diff, look, money: 3000, starter: null,
      team: [], box: [], bag: { potion: 5, ball1: 5 },
      badges: 0, loc: 0, unlocked: 0, defeated: {}, gymProg: {}, dex: {},
      stats: { battles: 0, wins: 0, caught: 0 }, champion: false,
      settings: { sfx: true, music: true, speed: 1 },
      created: Date.now(), savedAt: 0,
    };
    Game.save();
  };

  Game.playerLook = () => G.PLAYER_LOOKS[(Game.state && Game.state.look) || 0];
  Game.diff = () => G.DIFFS[Game.state.diff];

  // ── 存檔 ──
  Game.save = () => {
    if (!Game.state) return;
    Game.state.savedAt = Date.now();
    const ok = U.storage.set(KEY, JSON.stringify(Game.state));
    if (G.Cloud) G.Cloud.push(Game.state);
    return ok;
  };
  Game.writeLocal = (st) => U.storage.set(KEY, JSON.stringify(st));
  Game.readLocal = () => {
    const raw = U.storage.get(KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  };
  Game.load = (st) => {
    st = st || Game.readLocal();
    if (!st || !st.team) return false;
    Game.state = st;
    st.settings = Object.assign({ sfx: true, music: true, speed: 1 }, st.settings || {});
    G.Sound.sfxOn = st.settings.sfx;
    G.Sound.musicOn = st.settings.music;
    return true;
  };
  Game.exportCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(Game.state))));
  Game.importCode = (code) => {
    try {
      const st = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      if (!st.team || !st.name) return false;
      Game.load(st);
      Game.save();
      return true;
    } catch (e) { return false; }
  };
  Game.wipe = () => { U.storage.del(KEY); Game.state = null; };

  // ── 圖鑑與隊伍 ──
  Game.markSeen = (sp) => { const d = Game.state.dex; if (!d[sp]) d[sp] = 1; };
  Game.markCaught = (sp) => { Game.state.dex[sp] = 2; };
  Game.addMon = (m) => {
    Game.markCaught(m.sp);
    if (Game.state.team.length < 6) { Game.state.team.push(m); return 'team'; }
    Game.state.box.push(m);
    return 'box';
  };
  Game.allMons = () => Game.state.team.concat(Game.state.box);
  Game.alive = () => Game.state.team.filter((m) => m.hp > 0).length;
  Game.healAll = () => Game.state.team.forEach(G.Mon.heal);

  // ── 對手設定 ──
  Game.gymIndexOf = (tid) => {
    const L = G.LOCS.find((l) => l.gym && (l.gym.leader === tid || l.gym.trainers.includes(tid)));
    return L ? L.id : -1;
  };
  Game.aiFor = (t) => {
    const d = Game.diff().ai;
    if (t.champion || t.id === 'rival4') return Math.min(2, d + 1);
    if (t.leader) return Game.gymIndexOf(t.id) <= 2 ? d : Math.min(2, d + 1);
    return d;
  };
  Game.buildTeam = (t) => {
    const d = Game.diff();
    const ivVal = [10, 20, 28][Game.state.diff];
    return G.resolveTeam(t, Game.state.starter).map(([sp, lv, mv]) =>
      G.Mon.create(sp, Math.max(2, lv + d.lvAdj), { ivs: 'trainer', ivVal, moves: mv, friend: 0 }));
  };

  // ── 對戰 ──
  Game.battle = async (cfg) => {
    const s = Game.state;
    const b = new G.Battle({
      kind: cfg.kind, pTeam: s.team, eTeam: cfg.eTeam, trainer: cfg.trainer,
      player: { name: s.name, bag: s.bag }, aiLv: cfg.ai ?? Game.diff().ai, allowDmax: !!cfg.allowDmax,
    });
    const res = await G.BattleView.run(b, cfg);
    b.cleanup();
    await Game.afterBattle(b, cfg);
    return res;
  };

  Game.afterBattle = async (b, cfg) => {
    const s = Game.state;
    b.seen.forEach(Game.markSeen);
    s.stats.battles++;
    if (b.result === 'win') {
      s.stats.wins++;
      s.money += b.money || 0;
      s.team.forEach((m) => { if (m.hp > 0) m.friend = Math.min(100, m.friend + 1); });
    }
    if (b.result === 'caught') {
      const m = b.caught;
      m.friend = 35;
      s.stats.caught++;
      const where = Game.addMon(m);
      if (where === 'box') G.Mon.heal(m);
      Game.save();
      const nick = await Game.askNickname(m);
      if (nick) m.nick = nick;
      await G.UI.alert('抓到了！', `<div class="row" style="flex-wrap:nowrap"><div style="width:110px;flex:none">${G.Art.mon(m.sp)}</div>
        <p style="margin:0;line-height:1.7">${U.esc(G.Mon.name(m))} 加入了${where === 'team' ? '你的隊伍' : '<b>箱子</b>（隊伍已經有 6 隻了，可以到「隊伍」頁面交換）'}！<br>已登錄到圖鑑 📖</p></div>`);
    }
    if (b.result === 'lose') await Game.blackout(cfg);
    await Game.growth(b.learnQ);
    Game.save();
  };

  Game.askNickname = async (m) => {
    const v = await G.UI.modal({
      title: '要幫牠取名字嗎？',
      body: `<div class="form-row"><label for="nick-in">${G.SPECIES[m.sp].name} 的暱稱（可以不填）</label><input id="nick-in" class="input" maxlength="8" placeholder="${G.SPECIES[m.sp].name}"></div>`,
      buttons: [{ label: '不用了', value: 'skip', cls: 'white' }, { label: '就叫這個！', value: 'ok', cls: 'pink' }],
      onRender: (el, close) => {
        const inp = el.querySelector('#nick-in');
        inp.focus();
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { Game._nick = inp.value; close('ok'); } });
        inp.addEventListener('input', () => { Game._nick = inp.value; });
      },
    });
    const n = (Game._nick || '').trim();
    Game._nick = '';
    return v === 'ok' && n ? n.slice(0, 8) : '';
  };

  Game.blackout = async (cfg) => {
    const s = Game.state;
    const lost = Math.floor(s.money * 0.1);
    s.money -= lost;
    Game.healAll();
    Game.save();
    const tip = cfg && cfg.trainer && cfg.trainer.tip ? `小提示：${cfg.trainer.tip}` : '小提示：帶上能剋制對手屬性的萌獸，或先在野外多練幾級吧！';
    await G.UI.dialog([
      '眼前一片漆黑……',
      `${s.name} 急忙帶著萌獸們回到了療癒中心。${lost ? `（掉了 $${lost}）` : ''}`,
      '萌獸們都恢復精神了！別灰心，再挑戰一次吧！',
      tip,
    ], { who: '療癒中心', look: { hair: 'bun', hc: '#FF8FB8', outfit: '#FFFFFF' } });
  };

  Game.wild = async (loc) => {
    if (!Game.alive()) return G.UI.alert('萌獸都累倒了', '<p>先去 💗 療癒中心讓萌獸們休息一下吧！</p>');
    const sp = U.weighted(loc.wild.list);
    const lv = U.rand(loc.wild.lv[0], loc.wild.lv[1]);
    const m = G.Mon.create(sp, lv, { ivs: 'wild', friend: 0 });
    return Game.battle({ kind: 'wild', eTeam: [m], bg: loc.theme, music: 'battle' });
  };

  Game.fightTrainer = async (id, opt = {}) => {
    if (!Game.alive()) { await G.UI.alert('萌獸都累倒了', '<p>先去 💗 療癒中心讓萌獸們休息一下吧！</p>'); return null; }
    const t = G.TRAINERS[id];
    const team = Game.buildTeam(t);
    const items = Object.assign({}, t.items || {});
    if (Game.state.diff === 2) for (const k in items) items[k]++;
    if (Game.state.diff === 0 && t.leader) for (const k in items) items[k] = Math.max(0, items[k] - 1);
    const trainer = Object.assign({}, t, { items });
    const big = t.leader || t.rival;
    const res = await Game.battle({
      kind: 'trainer', eTeam: team, trainer, ai: Game.aiFor(t), allowDmax: !!t.dmax,
      bg: opt.bg || (t.champion ? 'champion' : opt.gym ? 'arena' : G.LOCS[Game.state.loc].theme),
      accent: opt.accent, music: big ? 'gym' : 'battle', tutorial: opt.tutorial,
    });
    if (res === 'win') Game.state.defeated[id] = (Game.state.defeated[id] || 0) + 1;
    Game.save();
    return res;
  };

  // ── 成長：學招式、進化 ──
  Game.growth = async (learnQ = []) => {
    const all = Game.allMons();
    for (const q of learnQ) {
      const m = all.find((x) => x.uid === q.uid);
      if (m) await Game.learnFlow(m, q.id);
    }
    for (const m of Game.state.team) {
      while (G.Mon.canEvolve(m)) {
        const res = await Game.evolveFlow(m);
        if (!res) break;
        for (const id of res.newMoves) await Game.learnFlow(m, id);
      }
    }
  };

  Game.learnFlow = async (m, id) => {
    if (m.moves.some((x) => x.id === id)) return;
    const name = U.esc(G.Mon.name(m)), mv = G.MOVES[id];
    if (m.moves.length < 4) {
      G.Mon.learn(m, id);
      G.Sound.sfx('levelup');
      G.UI.toast(`${G.Mon.name(m)} 學會了「${mv.name}」！`);
      return;
    }
    const card = (mid, i, isNew) => {
      const x = G.MOVES[mid], ti = G.TYPE_INFO[x.type];
      return `<div class="mv-item${isNew ? ' new' : ' pick'}" style="--tc:${ti.color}" ${isNew ? '' : `data-val="${i}" role="button" tabindex="0"`}>
        <b>${isNew ? '🆕 ' : ''}${x.name}</b> <span class="meta">${ti.icon}${ti.name}・${G.CAT_INFO[x.cat].name}${x.pow ? `・威力${x.pow}` : ''}・命中${x.acc ?? '必中'}</span>
        <p>${G.moveDesc(mid)}</p></div>`;
    };
    const v = await G.UI.modal({
      title: `${name} 想學新招式！`,
      wide: true,
      body: `<p style="margin:0 0 10px">${name} 想要學「<b>${mv.name}</b>」，但是已經會 4 個招式了。<br>點一個<b>要忘記的招式</b>，或選「不學了」。</p>
        ${card(id, -1, true)}<div style="height:10px"></div>
        <div class="mv-list">${m.moves.map((x, i) => card(x.id, i, false)).join('')}</div>`,
      buttons: [{ label: '不學了', value: 'no', cls: 'white' }],
    });
    if (v === null || v === 'no') {
      G.UI.toast(`${G.Mon.name(m)} 沒有學「${mv.name}」。`);
      return;
    }
    const old = G.MOVES[m.moves[+v].id].name;
    G.Mon.learn(m, id, +v);
    G.Sound.sfx('levelup');
    await G.UI.alert('學會新招式！', `<p style="font-size:17px;line-height:1.7">1、2……啪！${name} 忘記了「${old}」，<br>學會了「<b>${mv.name}</b>」！</p>`);
  };

  Game.evolveFlow = (m) =>
    new Promise((resolve) => {
      const from = m.sp, to = G.Mon.canEvolve(m);
      const oldName = G.Mon.name(m);
      const layer = document.createElement('div');
      layer.className = 'evo-layer';
      layer.innerHTML = `<div><div class="evo-art"><div class="a">${G.Art.mon(from)}</div><div class="b white" style="opacity:0">${G.Art.mon(to)}</div></div>
        <div class="evo-text">咦？${U.esc(oldName)} 的樣子……</div></div>`;
      document.body.appendChild(layer);
      G.Sound.sfx('evo');
      const a = layer.querySelector('.a'), bEl = layer.querySelector('.b');
      a.classList.add('white');
      let t = 0, flip = false, interval = 520;
      const step = () => {
        flip = !flip;
        a.style.opacity = flip ? 0 : 1;
        bEl.style.opacity = flip ? 1 : 0;
        t += interval;
        interval = Math.max(90, interval * 0.84);
        if (t < 4200) setTimeout(step, interval);
        else finish();
      };
      const finish = () => {
        const res = G.Mon.evolve(m);
        Game.markCaught(m.sp);
        a.style.opacity = 0;
        bEl.style.opacity = 1;
        bEl.classList.remove('white');
        G.Sound.sfx('win');
        G.UI.confetti(50);
        layer.querySelector('.evo-text').innerHTML = `恭喜！${U.esc(oldName)} 進化成了 <b style="color:#FFD23F">${G.SPECIES[to].name}</b>！<br><button class="btn pink" style="margin-top:14px">太棒了！</button>`;
        layer.querySelector('button').onclick = () => { layer.remove(); resolve(res); };
      };
      setTimeout(step, 900);
    });

  // ── 道館 ──
  Game.badgeCeremony = async (loc) => {
    const s = Game.state;
    const first = s.badges < loc.id;
    if (!first) return;
    s.badges = loc.id;
    s.unlocked = Math.max(s.unlocked, loc.id + 1);
    s.bag.candy = (s.bag.candy || 0) + 2;
    Game.save();
    G.Sound.sfx('win');
    G.UI.confetti(80);
    const unlockShop = G.SHOP_ORDER.filter((k) => G.ITEMS[k].badge === loc.id).map((k) => G.ITEMS[k].name);
    const next = G.LOCS[loc.id + 1];
    await G.UI.alert(`獲得了${loc.gym.badge}！`, `<div style="text-align:center">
      <div class="badge-big" style="--bc:${loc.color}">${G.TYPE_INFO[loc.gym.type].icon}</div>
      <p style="font-size:19px;margin:8px 0">${U.esc(s.name)} 獲得了 <b>${loc.gym.badge}</b>！（${s.badges}/8）</p>
      <p class="muted">獎勵：🍬 神奇糖果 ×2${unlockShop.length ? `<br>商店開始賣：${unlockShop.join('、')}` : ''}${next ? `<br>🗺️ 可以前往「${next.name}」了！` : ''}</p></div>`, '太好了！');
  };

  Game.championEnding = async () => {
    const s = Game.state;
    if (s.champion) return;
    s.champion = true;
    Game.save();
    G.UI.confetti(140);
    G.Sound.sfx('win');
    await G.UI.dialog([
      `恭喜你，${s.name}！`,
      '你打敗了冠軍星辰，成為了星光地區的新冠軍！',
      '一路上和萌獸們一起努力的回憶，一定會變成最珍貴的寶物。',
      '冠軍之後，冒險還沒結束喔：試著收集圖鑑上所有的萌獸，或是用「挑戰」難度再玩一次吧！',
    ], { who: G.PROF.name, look: G.PROF.look });
    await G.UI.alert('🏆 星光冠軍 🏆', `<div style="text-align:center"><div class="badge-big" style="--bc:#FFD23F">🏆</div>
      <p style="font-size:18px">${U.esc(s.name)} 的冠軍隊伍</p>
      <div class="row" style="justify-content:center">${s.team.map((m) => `<div style="width:84px;text-align:center">${G.Art.mon(m.sp)}<div class="small">${U.esc(G.Mon.name(m))}</div></div>`).join('')}</div></div>`, '耶！');
  };
})();

// ── js/ui/core.js ──
// 共用介面：畫面切換、彈窗、對話、提示
(function () {
  const U = G.U;
  const UI = (G.UI = {});
  G.Screens = {};
  const app = () => document.getElementById('app');

  UI.show = (name, params) => {
    UI.current = name;
    document.querySelectorAll('.modal-layer').forEach((m) => m.remove());
    app().onclick = null;
    G.Screens[name](params || {});
    window.scrollTo(0, 0);
  };

  UI.render = (html, onAct) => {
    const el = app();
    el.innerHTML = html;
    el.onclick = (e) => {
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled || !el.contains(b)) return;
      G.Sound.init();
      onAct && onAct(b.dataset.act, b, e);
    };
  };

  UI.hpClass = (hp, max) => {
    const p = max ? hp / max : 0;
    return p > 0.5 ? '' : p > 0.2 ? 'mid' : 'lo';
  };
  UI.hpBar = (hp, max) => `<div class="hpbar ${UI.hpClass(hp, max)}"><i style="width:${max ? Math.max(0, (hp / max) * 100) : 0}%"></i></div>`;
  UI.types = (types, sm) => types.map((t) => G.Art.typeBadge(t, sm)).join(' ');
  UI.statusChip = (st) => (st ? `<span class="chip st" style="--sc:${G.STATUS_INFO[st].color}">${G.STATUS_INFO[st].icon}${G.STATUS_INFO[st].name}</span>` : '');
  UI.hearts = (f) => {
    const n = Math.round(f / 20);
    let s = '';
    for (let i = 0; i < 5; i++) s += i < n ? '❤' : '<span class="off">❤</span>';
    return `<span class="hearts" title="感情 ${f}/100">${s}</span>`;
  };
  UI.stars = (n, max = 3) => {
    let s = '';
    for (let i = 0; i < max; i++) s += i < n ? '★' : '<span class="off">★</span>';
    return `<span class="stars">${s}</span>`;
  };
  UI.itemIcon = (id) => (G.ITEMS[id].kind === 'ball' ? G.Art.ball(id, 34) : `<span>${G.ITEMS[id].icon}</span>`);

  // ── 提示 ──
  UI.toast = (text, ms = 2200) => {
    let layer = document.querySelector('.toast-layer');
    if (!layer) {
      layer = document.createElement('div');
      layer.className = 'toast-layer';
      document.body.appendChild(layer);
    }
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    layer.appendChild(t);
    setTimeout(() => t.remove(), ms);
  };

  // ── 彈窗：回傳 Promise，按下 data-val 的按鈕或 X 時結束 ──
  UI.modal = ({ title, body, buttons = [], wide = false, onRender, closable = true }) =>
    new Promise((resolve) => {
      const layer = document.createElement('div');
      layer.className = 'modal-layer';
      layer.innerHTML = `<div class="modal panel${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
        <div class="modal-head"><h3>${title}</h3>${closable ? '<button class="modal-x" data-val="__close" aria-label="關閉">✕</button>' : ''}</div>
        <div class="modal-body">${body}</div>
        ${buttons.length ? `<div class="modal-foot">${buttons.map((b) => `<button class="btn ${b.cls || ''}" data-val="${b.value}" ${b.disabled ? 'disabled' : ''}>${b.label}</button>`).join('')}</div>` : ''}
      </div>`;
      document.body.appendChild(layer);
      const close = (v) => {
        layer.remove();
        resolve(v);
      };
      layer.addEventListener('click', (e) => {
        if (e.target === layer && closable) return close(null);
        const b = e.target.closest('[data-val]');
        if (!b || b.disabled) return;
        G.Sound.sfx(b.dataset.val === '__close' ? 'back' : 'select');
        close(b.dataset.val === '__close' ? null : b.dataset.val);
      });
      layer.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && closable) close(null);
      });
      if (onRender) onRender(layer.querySelector('.modal'), close);
      const first = layer.querySelector('.modal-foot .btn, .modal-x');
      if (first) first.focus({ preventScroll: true });
    });

  UI.confirm = (text, yes = '好', no = '取消') =>
    UI.modal({ title: '確認', body: `<p style="margin:0;font-size:17px;line-height:1.6">${text}</p>`, buttons: [{ label: no, value: 'no', cls: 'white' }, { label: yes, value: 'yes', cls: 'pink' }] }).then((v) => v === 'yes');

  UI.alert = (title, html, label = '好') => UI.modal({ title, body: html, buttons: [{ label, value: 'ok', cls: 'pink' }] });

  // ── 對話：lines 為字串陣列，who/look 決定頭像 ──
  UI.dialog = (lines, { who = '', look = null, mon = null } = {}) =>
    new Promise((resolve) => {
      const layer = document.createElement('div');
      layer.className = 'dialog-layer';
      const face = mon ? G.Art.mon(mon) : look ? G.Art.person(look) : '';
      layer.innerHTML = `<div class="dialog-box panel" role="dialog" tabindex="0">
        ${face ? `<div class="dialog-face">${face}</div>` : ''}
        <div class="dialog-text">${who ? `<span class="dialog-who">${who}</span>` : ''}<div class="dialog-line"></div><div class="dialog-next">點一下繼續 ▼</div></div>
      </div>`;
      document.body.appendChild(layer);
      const lineEl = layer.querySelector('.dialog-line');
      let i = 0, typing = null, full = '';
      const show = () => {
        full = lines[i];
        const t0 = performance.now();
        lineEl.textContent = '';
        clearInterval(typing);
        typing = setInterval(() => {
          const k = Math.floor((performance.now() - t0) / 26) + 1;
          lineEl.textContent = full.slice(0, k);
          if (k >= full.length) { clearInterval(typing); typing = null; }
        }, 26);
      };
      const next = () => {
        G.Sound.init();
        if (typing) { clearInterval(typing); typing = null; lineEl.textContent = full; return; }
        G.Sound.sfx('click');
        i++;
        if (i >= lines.length) { layer.remove(); resolve(); return; }
        show();
      };
      layer.addEventListener('click', next);
      layer.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } });
      layer.querySelector('.dialog-box').focus({ preventScroll: true });
      show();
    });

  // ── 選萌獸 ──
  UI.monPickCard = (m, i, { disabled = false, active = false, note = '' } = {}) => {
    const st = G.Mon.stats(m);
    return `<button class="pick-card${active ? ' active' : ''}" data-val="${i}" ${disabled ? 'disabled' : ''}>
      <div class="pa">${G.Art.mon(m.sp, { cls: 'still' })}</div>
      <div class="pi">
        <div class="pn">${U.esc(G.Mon.name(m))} <span>Lv.${m.lv}</span></div>
        <div class="row" style="gap:4px">${UI.types(G.SPECIES[m.sp].types, true)} ${UI.statusChip(m.status)}</div>
        ${UI.hpBar(m.hp, st.hp)}
        <small>HP ${m.hp}/${st.hp}${note ? ' · ' + note : ''}</small>
      </div>
    </button>`;
  };

  UI.pickMon = (title, mons, filter = () => true, opts = {}) =>
    UI.modal({
      title,
      wide: true,
      closable: opts.closable !== false,
      body: (opts.intro || '') + `<div class="pick-grid">${mons.map((m, i) => UI.monPickCard(m, i, { disabled: !filter(m, i), active: opts.active === i, note: opts.note ? opts.note(m, i) : '' })).join('')}</div>`,
    }).then((v) => (v === null ? null : +v));

  // ── 上方狀態列 ──
  UI.hud = () => {
    const s = G.Game.state;
    let badges = '';
    for (let i = 1; i <= 8; i++) {
      const L = G.LOCS[i];
      const got = s.badges >= i;
      badges += `<span class="badge-slot${got ? ' got' : ''}" style="--bc:${got ? L.color : 'transparent'}" title="${L.gym.badge}">${got ? G.TYPE_INFO[L.gym.type].icon : ''}</span>`;
    }
    return `<header class="hud">
      <div class="hud-who"><div class="hud-avatar">${G.Art.person(G.Game.playerLook())}</div>
        <div><div class="hud-name">${U.esc(s.name)}${s.champion ? ' 👑' : ''}</div><div class="hud-money num">💰 ${U.fmtMoney(s.money)}</div></div></div>
      <div class="hud-badges" aria-label="徽章 ${s.badges}/8">${badges}</div>
      <nav class="hud-menu">
        <button class="btn sm white" data-act="nav-map">🗺️ 地圖</button>
        <button class="btn sm mint" data-act="nav-team">🐾 隊伍</button>
        <button class="btn sm" data-act="nav-bag">🎒 背包</button>
        <button class="btn sm blue" data-act="nav-dex">📖 圖鑑</button>
        <button class="btn sm pink" data-act="nav-types">🔥 屬性表</button>
        <button class="btn sm white" data-act="nav-settings" aria-label="設定">⚙️</button>
      </nav>
    </header>`;
  };

  // HUD 按鈕的共用處理，回傳 true 代表已處理
  UI.hudAct = (act) => {
    const map = { 'nav-map': 'map', 'nav-team': 'team', 'nav-bag': 'bag', 'nav-dex': 'dex', 'nav-types': 'types' };
    if (map[act]) { G.Sound.sfx('click'); UI.show(map[act]); return true; }
    if (act === 'nav-settings') { G.Screens.settings(); return true; }
    return false;
  };

  // 彩色紙片
  UI.confetti = (n = 60) => {
    const cols = ['#FF5D8F', '#FFD23F', '#36CF9C', '#4F8EF0', '#B27BFF'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = cols[i % cols.length];
      c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
      c.style.animationDelay = Math.random() * 0.6 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4200);
    }
  };
})();

// ── js/ui/battleview.js ──
// 對戰畫面：播放引擎事件、選擇指令、屬性小幫手
(function () {
  const U = G.U;
  const BV = (G.BattleView = {});
  let b, cfg, disp, resolveChoice, dmaxArmed, tipIdx = 0;
  const $ = (s) => document.querySelector(s);
  const speed = () => G.Game.state.settings.speed;

  const TIPS = [
    '同屬性加成：萌獸使用和自己屬性一樣的招式，威力 ×1.5！（招式上有 ★同屬性）',
    '兩個屬性的萌獸，弱點會相乘：例如岩石＋地面被水打到是 ×4！',
    '速度快的萌獸先攻擊。「快速突擊」這種先制招式一定先出手。',
    '物理招式看「攻擊」和對手的「防禦」；特殊招式看「特攻」和「特防」。',
    '灼傷會讓物理攻擊減半，麻痺會讓速度變慢、有時動不了。',
    '對手 HP 越少越好抓！讓牠睡著或麻痺，更容易抓到喔。',
    '打不過的時候，換上能抵抗對手屬性的夥伴，也是好策略！',
    '草屬性不怕粉末類招式（催眠粉、麻痺粉、毒粉）。',
    '火不會灼傷、電不會麻痺、冰不會冰凍；毒和鋼不會中毒。',
    '館主的王牌會「星光巨大化」：3 回合內 HP 和招式威力大增！你也可以用一次。',
    '感情越好（❤️越多），越可能在危險時撐住，也更容易打出會心一擊！',
    '「劍舞」「冥想」這類招式能提升能力，趁對手打不痛你時用最划算。',
    '「禍不單行」打陷入異常狀態的對手時威力加倍！',
    '看看對手的「特性」：飄浮的萌獸不怕地面招式，引火的不怕火！',
  ];

  BV.run = async (battle, config) => {
    b = battle;
    cfg = config || {};
    disp = { p: null, e: null };
    dmaxArmed = false;
    render();
    G.Sound.music(cfg.music || 'battle');
    await play(b.start());
    while (!b.over) {
      if (b.need === 'switch') {
        const idx = await G.UI.pickMon('下一隻要派誰上場？', b.S.p.team, (m) => m.hp > 0, { closable: false, note: noteFor });
        await play(b.forceSwitch(idx));
        continue;
      }
      const act = await choose();
      tipIdx++;
      await play(b.turn(act));
    }
    await U.sleep(450);
    return b.result;
  };

  // ───────── 畫面 ─────────
  function render() {
    const collapsed = window.innerWidth < 980 && !cfg.tutorial;
    G.UI.render(`<div class="screen"><div class="bt-screen">
      <div class="bt-main">
        <div class="bt-stage" id="stage">
          <div class="bt-scene">${G.Art.scene(cfg.bg || 'meadow', cfg.accent)}</div>
          <div class="bt-plat e"></div><div class="bt-plat p"></div>
          <div class="bt-trainer" id="bt-trainer">${b.trainer ? G.Art.person(b.trainer.look) : ''}</div>
          <div class="bt-mon e gone" id="mon-e"><div class="wrap"><div class="scale"></div></div></div>
          <div class="bt-mon p gone" id="mon-p"><div class="wrap"><div class="scale"></div></div></div>
          <div class="bt-card e hide" id="card-e"></div>
          <div class="bt-card p hide" id="card-p"></div>
          <div class="bt-fx" id="fx"></div>
        </div>
        <div class="bt-console">
          <div class="bt-msg panel" id="msg" aria-live="polite"><p></p><span class="next">▼</span></div>
          <div class="bt-cmd" id="cmd"></div>
        </div>
      </div>
      <aside class="bt-help panel${collapsed ? ' collapsed' : ''}" id="help"></aside>
    </div></div>`, onAct);
    renderHelp();
    const cmd = $('#cmd');
    cmd.addEventListener('mouseover', (e) => {
      const btn = e.target.closest('.mv-btn');
      if (!btn || !resolveChoice) return;
      const i = +btn.dataset.i;
      const s = b.mon('p').moves[i];
      if (!s) return;
      const mv = G.MOVES[s.id];
      hint(`<b>${mv.name}</b>（${G.CAT_INFO[mv.cat].name}${mv.pow ? `・威力 ${mv.pow}` : ''}・命中 ${mv.acc ?? '必中'}）<br>${G.moveDesc(s.id)}`);
    });
    cmd.addEventListener('mouseleave', () => resolveChoice && cmd.classList.contains('moves') && hint('要使出哪一招呢？'));
  }

  function onAct(act, el) {
    if (act === 'help-toggle') { $('#help').classList.toggle('collapsed'); renderHelp(); return; }
    if (act === 'chart') { G.Screens.typesModal(); return; }
    if (!resolveChoice) return;
    G.Sound.sfx('click');
    if (act === 'fight') showMoves();
    else if (act === 'back') showMain();
    else if (act === 'dmax') { dmaxArmed = !dmaxArmed; showMoves(); }
    else if (act === 'move') done({ type: 'move', idx: +el.dataset.i, dmax: dmaxArmed });
    else if (act === 'party') partyMenu();
    else if (act === 'bag') bagMenu();
    else if (act === 'run') done({ type: 'run' });
  }

  function choose() {
    return new Promise((res) => {
      resolveChoice = res;
      dmaxArmed = false;
      showMain();
    });
  }
  function done(act) {
    const r = resolveChoice;
    resolveChoice = null;
    $('#cmd').innerHTML = '';
    $('#cmd').className = 'bt-cmd';
    r(act);
  }

  function hint(html) {
    const p = $('#msg p');
    p.innerHTML = `<span class="hint">${html}</span>`;
  }

  function showMain() {
    const cmd = $('#cmd');
    cmd.className = 'bt-cmd';
    cmd.innerHTML = `<button class="btn cmd-btn fight" data-act="fight">⚔️ 戰鬥</button>
      <button class="btn cmd-btn party" data-act="party">🔄 換萌獸</button>
      <button class="btn cmd-btn bag" data-act="bag">🎒 背包</button>
      <button class="btn cmd-btn run" data-act="run" ${b.kind === 'wild' ? '' : 'disabled title="訓練家對戰不能逃跑"'}>🏃 逃跑</button>`;
    const n = G.Mon.name(b.mon('p'));
    hint(cfg.tutorial && b.turnNo === 0
      ? `💡 點「戰鬥」選招式！右邊的<b>屬性小幫手</b>會告訴你哪一招最有效。`
      : `${U.esc(n)} 要怎麼做呢？`);
    cmd.querySelector('.fight').focus({ preventScroll: true });
  }

  function effVs(mv, foe) {
    let e = G.eff(mv.type, G.SPECIES[foe.sp].types);
    if (foe.ability === 'levitate' && mv.type === 'ground') e = 0;
    if (foe.ability === 'flashfire' && mv.type === 'fire') e = 0;
    if (foe.ability === 'sapsipper' && mv.type === 'grass') e = 0;
    return e;
  }

  function showMoves() {
    const m = b.mon('p'), foe = b.mon('e');
    const myTypes = G.SPECIES[m.sp].types;
    const dm = b.S.p.vol.dmax > 0 || dmaxArmed;
    const cmd = $('#cmd');
    cmd.className = 'bt-cmd moves';
    const any = m.moves.some((s) => s.pp > 0);
    let html = '';
    if (!any) {
      html = `<button class="mv-btn" style="--tc:#A8A77A;grid-column:span 2" data-act="move" data-i="-1"><span class="mv-name">掙扎</span><span class="mv-meta">招式都沒有 PP 了，只能拚命掙扎！</span></button>`;
    } else {
      m.moves.forEach((s, i) => {
        const mv = G.MOVES[s.id], ti = G.TYPE_INFO[mv.type];
        let tag = '';
        if (mv.cat !== 'T') {
          const e = effVs(mv, foe);
          const L = G.effLabel(e);
          tag = `<span class="eff-tag ${L.cls}">${L.text} ${L.short}</span>`;
        } else tag = `<span class="eff-tag e1">變化招式</span>`;
        const stab = mv.cat !== 'T' && myTypes.includes(mv.type) ? '<span class="stab-tag">★同屬性</span>' : '';
        const pow = mv.pow ? (dm ? G.Dmg.dmaxPow(mv.pow) : mv.pow) : 0;
        html += `<button class="mv-btn" style="--tc:${ti.color}" data-act="move" data-i="${i}" ${s.pp <= 0 ? 'disabled' : ''}>
          <span class="mv-name">${dm && mv.cat !== 'T' ? '巨大' : ''}${mv.name}</span>
          <span class="mv-meta">${ti.icon} ${ti.name}・${G.CAT_INFO[mv.cat].name}${pow ? `・威力 ${pow}` : ''}</span>
          <span class="mv-bottom">${tag}${stab}</span>
          <span class="mv-pp">PP ${s.pp}/${mv.pp}</span>
        </button>`;
      });
    }
    const canDmax = !b.S.p.dmaxUsed && b.S.p.vol.dmax === 0;
    html += `<div class="cmd-row"><button class="btn white" data-act="back">↩ 返回</button>${canDmax ? `<button class="btn dmax-btn${dmaxArmed ? ' on' : ''}" data-act="dmax">🌟 星光巨大化${dmaxArmed ? '：準備好了！' : ''}</button>` : ''}</div>`;
    cmd.innerHTML = html;
    hint(dmaxArmed ? '🌟 選一個招式，萌獸就會巨大化並使出巨大招式！（3 回合）' : '要使出哪一招呢？把滑鼠移到招式上可以看說明。');
  }

  const noteFor = (m) => {
    if (!b || m.hp <= 0) return '';
    const foe = b.mon('e');
    const ft = G.SPECIES[foe.sp].types, mt = G.SPECIES[m.sp].types;
    const worst = Math.max(...ft.map((t) => G.eff(t, mt)));
    const best = Math.max(0, ...m.moves.map((s) => G.MOVES[s.id]).filter((mv) => mv.cat !== 'T').map((mv) => effVs(mv, foe)));
    const out = [];
    if (best >= 2) out.push('💥有絕佳招式');
    if (worst >= 2) out.push('⚠️怕對手屬性');
    else if (worst <= 0.5) out.push('🛡️能抵抗對手');
    return out.join(' ');
  };

  async function partyMenu() {
    const team = b.S.p.team;
    const v = await G.UI.pickMon('要換哪一隻萌獸上場？', team, (m, i) => m.hp > 0 && i !== b.S.p.idx, {
      active: b.S.p.idx,
      note: (m, i) => (i === b.S.p.idx ? '戰鬥中' : noteFor(m)),
      intro: '<p class="muted small" style="margin:0 0 10px">換人會用掉這一回合。💥 = 有效果絕佳的招式；⚠️ = 怕對手的屬性；🛡️ = 能抵抗對手。</p>',
    });
    if (v !== null && resolveChoice) done({ type: 'switch', idx: v });
  }

  async function bagMenu() {
    const bag = G.Game.state.bag;
    const ids = Object.keys(G.ITEMS).filter((k) => bag[k] > 0 && G.ITEMS[k].kind !== 'candy');
    if (!ids.length) { G.UI.toast('背包是空的！'); return; }
    const body = `<div class="item-list">${ids.map((k) => `<div class="item-row"><div class="item-ico">${G.UI.itemIcon(k)}</div>
      <div class="item-info"><b>${G.ITEMS[k].name}</b><p>${G.ITEMS[k].desc}</p></div><div class="item-qty">×${bag[k]}</div>
      <button class="btn sm pink" data-val="${k}">使用</button></div>`).join('')}</div>`;
    const k = await G.UI.modal({ title: '🎒 背包', body, wide: false });
    if (!k || !resolveChoice) return;
    const it = G.ITEMS[k];
    if (it.kind === 'ball') {
      if (b.kind !== 'wild') { G.UI.toast('訓練家的萌獸不能抓喔！'); return; }
      if (G.Game.state.team.length + G.Game.state.box.length >= 300) { G.UI.toast('箱子已經滿了！'); return; }
      done({ type: 'ball', item: k });
      return;
    }
    const team = b.S.p.team;
    const ok = (m, i) => {
      const mx = i === b.S.p.idx ? b.maxHp('p') : G.Mon.stats(m).hp;
      if (it.kind === 'heal') return m.hp > 0 && m.hp < mx;
      if (it.kind === 'cure') return m.hp > 0 && !!m.status;
      if (it.kind === 'revive') return m.hp <= 0;
      return false;
    };
    if (!team.some(ok)) { G.UI.toast('現在用不到這個道具。'); return; }
    const t = await G.UI.pickMon(`要對誰使用${it.name}？`, team, ok);
    if (t !== null && resolveChoice) done({ type: 'item', item: k, target: t });
  }

  // ───────── 事件播放 ─────────
  async function play(evs) {
    for (const ev of evs) await handle(ev);
  }

  async function handle(ev) {
    switch (ev.t) {
      case 'msg': return say(ev.text);
      case 'send': return sendIn(ev);
      case 'recall': return recall(ev.side);
      case 'trainer': return trainerShow(ev.on);
      case 'atk': return atkAnim(ev);
      case 'hit': return hitAnim(ev);
      case 'hp':
      case 'status': return updateCard(ev.side, ev.view);
      case 'stat': updateCard(ev.side, ev.view, false); return statAnim(ev);
      case 'fx': return fxAnim(ev);
      case 'faint': return faintAnim(ev.side);
      case 'dmax': return dmaxAnim(ev);
      case 'exp': return expAnim(ev);
      case 'levelup': return levelUpAnim(ev);
      case 'ball': return ballAnim(ev);
    }
  }

  function say(text) {
    return new Promise(async (resolve) => {
      const box = $('#msg');
      if (!box) return resolve();
      const p = box.querySelector('p');
      let skip = false;
      const onClick = () => { skip = true; };
      box.addEventListener('click', onClick);
      box.classList.remove('wait');
      const sp = speed();
      const cps = sp === 2 ? 8 : sp === 0 ? 36 : 20;
      if (sp === 2) p.textContent = text;
      else {
        // 依經過時間決定顯示幾個字，分頁在背景被降速時也不會卡住
        const t0 = performance.now();
        let shown = 0;
        while (!skip && shown < text.length) {
          shown = Math.min(text.length, Math.floor((performance.now() - t0) / cps) + 1);
          p.textContent = text.slice(0, shown);
          await U.sleep(16);
        }
        p.textContent = text;
      }
      skip = false;
      const pause = sp === 2 ? 420 : sp === 0 ? 1200 : 720;
      const t0 = performance.now();
      box.classList.add('wait');
      while (!skip && performance.now() - t0 < pause) await U.sleep(30);
      box.classList.remove('wait');
      box.removeEventListener('click', onClick);
      resolve();
    });
  }

  function cardHTML(side, v) {
    const stChips = Object.entries(v.st).filter(([, d]) => d)
      .map(([k, d]) => `<span class="chip ${d > 0 ? 'up' : 'down'}">${G.STAT_NAMES[k]}${d > 0 ? '↑' : '↓'}${Math.abs(d)}</span>`).join('');
    return `<div class="cd-top"><span class="cd-name">${U.esc(v.name)}</span><span class="cd-lv">Lv.${v.lv}</span></div>
      <div class="cd-row keep">${G.UI.types(v.types, true)} ${G.UI.statusChip(v.status)}${v.dmax ? `<span class="chip dmax">🌟巨大化 剩${v.dmax}回合</span>` : ''}</div>
      ${stChips ? `<div class="cd-row">${stChips}</div>` : ''}
      <div class="cd-hp"><b>HP</b>${G.UI.hpBar(v.hp, v.max)}</div>
      ${side === 'p' ? `<div class="cd-hpnum"><span class="hpn">${v.hp}</span> / ${v.max}</div><div class="cd-exp expbar"><i style="width:${v.exp * 100}%"></i></div>` : ''}`;
  }

  function updateCard(side, v, anim = true) {
    const el = $('#card-' + side);
    if (!el) return;
    const prev = disp[side];
    disp[side] = v;
    el.innerHTML = cardHTML(side, v);
    el.classList.remove('hide');
    renderHelp();
    if (anim && prev && prev.uid === v.uid && prev.hp !== v.hp) {
      const bar = el.querySelector('.hpbar'), fill = bar.querySelector('i');
      fill.style.transition = 'none';
      fill.style.width = (prev.hp / prev.max) * 100 + '%';
      bar.className = 'hpbar ' + G.UI.hpClass(prev.hp, prev.max);
      void fill.offsetWidth;
      fill.style.transition = '';
      fill.style.width = (v.hp / v.max) * 100 + '%';
      bar.className = 'hpbar ' + G.UI.hpClass(v.hp, v.max);
      const num = el.querySelector('.hpn');
      if (num) countNum(num, prev.hp, v.hp, 520);
      return U.sleep(560);
    }
  }

  function countNum(el, a, z, ms) {
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      el.textContent = Math.round(a + (z - a) * k);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // 位置工具
  function center(side) {
    const st = $('#stage').getBoundingClientRect();
    const r = $('#mon-' + side + ' .scale').getBoundingClientRect();
    return { x: r.left - st.left + r.width / 2, y: r.top - st.top + r.height * 0.55, w: r.width, h: r.height };
  }
  function particle(content, x, y, cls = 'fx-p') {
    const s = document.createElement('span');
    s.className = cls;
    s.textContent = content;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    $('#fx').appendChild(s);
    return s;
  }
  async function burst(side, emoji, n = 6, spread = 0.5) {
    const c = center(side);
    const anims = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.6;
      const r = c.w * spread * (0.5 + Math.random() * 0.5);
      const s = particle(emoji, c.x, c.y);
      const an = s.animate([
        { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(1.1)`, opacity: 1, offset: 0.6 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * r * 1.2}px), calc(-50% + ${Math.sin(a) * r * 1.2 - 10}px)) scale(.8)`, opacity: 0 },
      ], { duration: 650, easing: 'ease-out' });
      anims.push(an.finished.then(() => s.remove()));
    }
    await Promise.all(anims);
  }
  async function projectile(from, to, emoji, n = 6) {
    const a = center(from), z = center(to);
    const anims = [];
    for (let i = 0; i < n; i++) {
      const s = particle(emoji, a.x, a.y);
      const jitter = (Math.random() - 0.5) * 40;
      const an = s.animate([
        { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 },
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.1 },
        { transform: `translate(calc(-50% + ${z.x - a.x}px), calc(-50% + ${z.y - a.y + jitter}px)) scale(1.2)`, opacity: 1 },
      ], { duration: 420, delay: i * 60, easing: 'ease-in' });
      anims.push(an.finished.then(() => s.remove()));
    }
    await Promise.all(anims);
  }
  function popText(side, text, cls = '', dy = 0) {
    const c = center(side);
    const s = particle(text, c.x, c.y - c.h * 0.3 + dy, 'fx-txt ' + cls);
    s.animate([
      { transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 },
      { transform: 'translate(-50%,-80%) scale(1.15)', opacity: 1, offset: 0.25 },
      { transform: 'translate(-50%,-150%) scale(1)', opacity: 0 },
    ], { duration: 1100, easing: 'ease-out' }).finished.then(() => s.remove());
  }
  function shakeStage() {
    const st = $('#stage');
    st.classList.remove('stage-shake');
    void st.offsetWidth;
    st.classList.add('stage-shake');
  }

  async function sendIn(ev) {
    const side = ev.side;
    const el = $('#mon-' + side);
    el.classList.remove('dmax');
    el.querySelector('.scale').innerHTML = G.Art.mon(ev.view.sp);
    el.querySelector('.wrap').style.opacity = 1;
    disp[side] = null;
    updateCard(side, ev.view, false);
    G.Sound.sfx('send');
    await U.sleep(50);
    el.classList.remove('gone');
    burst(side, ev.wild ? '🍃' : '✨', 8, 0.45);
    if (side === 'e') G.Game.markSeen(ev.view.sp);
    await U.sleep(520);
  }

  async function recall(side) {
    const el = $('#mon-' + side);
    G.Sound.sfx('back');
    el.classList.add('gone');
    el.classList.remove('dmax');
    await U.sleep(450);
    $('#card-' + side).classList.add('hide');
  }

  async function trainerShow(on) {
    const t = $('#bt-trainer');
    if (!t || !b.trainer) return;
    t.classList.toggle('on', on);
    await U.sleep(on ? 450 : 300);
  }

  async function atkAnim(ev) {
    const side = ev.side, tgt = side === 'p' ? 'e' : 'p';
    const w = $(`#mon-${side} .wrap`);
    const ti = G.TYPE_INFO[ev.type];
    if (ev.cat === 'P') {
      const dx = side === 'p' ? 1 : -1;
      G.Sound.sfx('throw');
      await w.animate([
        { transform: 'translate(0,0)' },
        { transform: `translate(${dx * 16}%, ${-dx * 12}%) rotate(${dx * 6}deg)`, offset: 0.45 },
        { transform: 'translate(0,0)' },
      ], { duration: 380, easing: 'ease-in-out' }).finished;
      if (!ev.miss && !ev.blocked) burst(tgt, ti.icon, 5, 0.35);
    } else if (ev.cat === 'S') {
      w.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }], { duration: 300 });
      G.Sound.sfx('throw');
      await projectile(side, tgt, ti.icon, ev.dmax ? 10 : 6);
    } else {
      G.Sound.sfx('status');
      if (ev.self) await burst(side, '✨', 6, 0.4);
      else await projectile(side, tgt, ti.icon, 4);
    }
    if (ev.miss) { G.Sound.sfx('miss'); popText(tgt, '沒打中！', 'bad'); await U.sleep(250); }
    if (ev.blocked) { popText(tgt, '擋住了！', 'bad'); await U.sleep(250); }
  }

  async function hitAnim(ev) {
    const w = $(`#mon-${ev.side} .wrap`);
    G.Sound.sfx(ev.eff > 1 ? 'super' : ev.eff < 1 ? 'weak' : 'hit');
    w.animate([{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }], { duration: 420 });
    w.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6%)' }, { transform: 'translateX(6%)' }, { transform: 'translateX(0)' }], { duration: 320 });
    if (ev.eff > 1 || ev.crit) shakeStage();
    popText(ev.side, `-${ev.dmg}`, 'dmg');
    if (ev.crit) popText(ev.side, '會心一擊！', 'crit', -30);
    else if (ev.eff > 1) popText(ev.side, ev.eff >= 4 ? '超級有效！！' : '效果絕佳！', 'good', -30);
    else if (ev.eff < 1) popText(ev.side, '效果不好…', 'bad', -30);
    await U.sleep(380);
  }

  async function statAnim(ev) {
    const up = ev.delta > 0;
    G.Sound.sfx(up ? 'up' : 'down');
    popText(ev.side, `${G.STAT_NAMES[ev.stat]}${up ? '↑' : '↓'}`, up ? 'good' : 'bad');
    const c = center(ev.side);
    const anims = [];
    for (let i = 0; i < 5; i++) {
      const s = particle(up ? '🔼' : '🔽', c.x + (i - 2) * c.w * 0.15, c.y + (up ? c.h * 0.2 : -c.h * 0.3));
      anims.push(s.animate([
        { transform: 'translate(-50%,-50%)', opacity: 0 },
        { opacity: 1, offset: 0.2 },
        { transform: `translate(-50%, calc(-50% + ${up ? -60 : 60}px))`, opacity: 0 },
      ], { duration: 700, delay: i * 70 }).finished.then(() => s.remove()));
    }
    await Promise.all(anims);
  }

  const FX_ICON = { brn: '🔥', par: '⚡', psn: '💜', tox: '☠️', slp: '💤', frz: '🧊', heal: '💚', hurt: '💢' };
  async function fxAnim(ev) {
    if (ev.kind === 'protect') {
      const c = center(ev.side);
      const d = document.createElement('div');
      d.className = 'fx-shield';
      d.style.left = c.x - c.w * 0.45 + 'px';
      d.style.top = c.y - c.w * 0.45 + 'px';
      d.style.width = d.style.height = c.w * 0.9 + 'px';
      $('#fx').appendChild(d);
      G.Sound.sfx('heal');
      await d.animate([{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1)', opacity: 1, offset: 0.3 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }], { duration: 900 }).finished;
      d.remove();
      return;
    }
    G.Sound.sfx(ev.kind === 'heal' ? 'heal' : 'status');
    await burst(ev.side, FX_ICON[ev.kind] || '✨', ev.kind === 'heal' ? 6 : 5, 0.35);
  }

  async function faintAnim(side) {
    const el = $('#mon-' + side), w = el.querySelector('.wrap');
    G.Sound.sfx('faint');
    await w.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(35%)', opacity: 0 }], { duration: 520, easing: 'ease-in' }).finished;
    w.style.opacity = 0;
    el.classList.add('gone');
    el.classList.remove('dmax');
    $('#card-' + side).classList.add('hide');
  }

  async function dmaxAnim(ev) {
    const el = $('#mon-' + ev.side);
    if (ev.on) {
      G.Sound.sfx('dmax');
      shakeStage();
      el.classList.add('dmax');
      burst(ev.side, '🌟', 10, 0.6);
      updateCard(ev.side, ev.view, false);
      await U.sleep(700);
    } else {
      el.classList.remove('dmax');
      if (ev.view.hp > 0) updateCard(ev.side, ev.view, false);
      await U.sleep(400);
    }
  }

  async function expAnim(ev) {
    const el = $('#card-p');
    const fill = el && el.querySelector('.expbar i');
    if (fill) {
      if (ev.levels > 0) {
        fill.style.width = '100%';
        await U.sleep(620);
        fill.style.transition = 'none';
        fill.style.width = '0%';
        void fill.offsetWidth;
        fill.style.transition = '';
      }
      fill.style.width = ev.view.exp * 100 + '%';
      await U.sleep(500);
    }
    if (disp.p) disp.p.exp = ev.view.exp;
  }

  async function levelUpAnim(ev) {
    G.Sound.sfx('levelup');
    const el = $('#card-p');
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    const lv = el.querySelector('.cd-lv');
    if (lv) lv.textContent = 'Lv.' + ev.lv;
    popText('p', 'LEVEL UP!', 'good');
    burst('p', '⭐', 6, 0.45);
    await U.sleep(300);
  }

  async function ballAnim(ev) {
    const st = $('#stage').getBoundingClientRect();
    const z = center('e');
    const ball = document.createElement('div');
    ball.className = 'fx-ball';
    ball.innerHTML = G.Art.ball(ev.item, 40);
    $('#fx').appendChild(ball);
    const sx = st.width * 0.12, sy = st.height * 0.92;
    G.Sound.sfx('throw');
    await ball.animate([
      { left: sx + 'px', top: sy + 'px', transform: 'translate(-50%,-50%) rotate(0deg)' },
      { left: (sx + z.x) / 2 + 'px', top: st.height * 0.05 + 'px', offset: 0.5 },
      { left: z.x + 'px', top: z.y + 'px', transform: 'translate(-50%,-50%) rotate(900deg)' },
    ], { duration: 650, easing: 'ease-out' }).finished;
    ball.style.left = z.x + 'px';
    ball.style.top = z.y + 'px';
    if (ev.shakes < 0) {
      G.Sound.sfx('miss');
      popText('e', '彈開了！', 'bad');
      await ball.animate([{ transform: 'translate(-50%,-50%)' }, { transform: 'translate(150%, 200%) rotate(-300deg)', opacity: 0 }], { duration: 500 }).finished;
      ball.remove();
      return;
    }
    burst('e', '✨', 6, 0.3);
    $('#mon-e').classList.add('gone');
    await U.sleep(380);
    const groundY = z.y + z.h * 0.32;
    await ball.animate([{ top: z.y + 'px' }, { top: groundY + 'px' }], { duration: 300, easing: 'cubic-bezier(.5,0,1,.5)' }).finished;
    ball.style.top = groundY + 'px';
    for (let i = 0; i < ev.shakes; i++) {
      await U.sleep(320);
      G.Sound.sfx('shake');
      await ball.animate([
        { transform: 'translate(-50%,-50%) rotate(0)' }, { transform: 'translate(-50%,-50%) rotate(-28deg)' },
        { transform: 'translate(-50%,-50%) rotate(24deg)' }, { transform: 'translate(-50%,-50%) rotate(0)' },
      ], { duration: 460 }).finished;
    }
    await U.sleep(300);
    if (ev.ok) {
      G.Sound.sfx('catch');
      const c = center('e');
      for (let i = 0; i < 6; i++) {
        const s = particle('⭐', z.x, groundY);
        const a = -Math.PI / 2 + (i - 2.5) * 0.4;
        s.animate([{ transform: 'translate(-50%,-50%)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * c.w * 0.4}px), calc(-50% + ${Math.sin(a) * c.w * 0.4}px))`, opacity: 0 }], { duration: 800 }).finished.then(() => s.remove());
      }
      ball.style.filter = 'brightness(.85)';
      await U.sleep(900);
    } else {
      G.Sound.sfx('send');

  // ───────── 屬性小幫手 ─────────
  function renderHelp() {
    const h = $('#help');
    if (!h) return;
    const collapsed = h.classList.contains('collapsed');
    if (!disp.e || !disp.p) {
      h.innerHTML = `<div class="help-head"><h3>🔍 屬性小幫手</h3></div><div class="help-body"><div class="help-sec muted small">對戰開始後，這裡會告訴你怎麼打最有效！</div></div>`;
      return;

    // 以畫面上正在顯示的萌獸為準（引擎可能已經算到下一隻）
    const e = b.S.e.team.find((x) => x.uid === disp.e.uid) || b.mon('e');
    const p = b.S.p.team.find((x) => x.uid === disp.p.uid) || b.mon('p');

      return `<div class="help-warn">• 對手的 ${ti.icon}${ti.name} 招式打你是普通傷害</div>`;
    }).join('');
    const eAb = G.ABILITIES[e.ability], pAb = G.ABILITIES[p.ability];
    h.innerHTML = `<div class="help-head"><h3>🔍 屬性小幫手</h3><button class="btn sm white help-toggle" data-act="help-toggle">${collapsed ? '展開 ▼' : '收起 ▲'}</button></div>

          <div class="help-row"><span class="lab g">超有效 💥</span><div class="vals">${strong}</div></div>

          <div class="help-row"><span class="lab z">沒有效果</span><div class="vals">${badges(prof.zero)}</div></div>
          ${eAb ? `<div class="help-ab">特性 <b>${eAb.name}</b>：${eAb.desc}</div>` : ''}
        </div>
        <div class="help-sec"><h4>你的招式打牠</h4>${moves}</div>
        <div class="help-sec"><h4>小心對手的攻擊</h4>${warns}${pAb ? `<div class="help-ab" style="margin-top:4px">你的特性 <b>${pAb.name}</b>：${pAb.desc}</div>` : ''}</div>

(function () {
  const U = G.U;
  const S = G.Screens;

  // 平滑曲線（Catmull-Rom → Bezier）
  const smooth = (pts) => {
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x} ${p2.y}`;
    }
    return d;
  };

  function mapSVG() {
    const s = G.Game.state;
    const L = G.LOCS;
    const tree = (x, y, r = 14, c = '#4FAE3F') => `<g><rect x="${x - 3}" y="${y}" width="6" height="${r * 0.9}" fill="#8A5A35"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#2F6B2A" stroke-width="2"/><circle cx="${x - r * 0.35}" cy="${y - r * 0.35}" r="${r * 0.3}" fill="#fff" opacity=".2"/></g>`;
    const house = (x, y, c) => `<g><rect x="${x - 12}" y="${y - 10}" width="24" height="18" rx="2" fill="#FFF6E0" stroke="#23305E" stroke-width="2"/><path d="M${x - 16} ${y - 8} L${x} ${y - 22} L${x + 16} ${y - 8} Z" fill="${c}" stroke="#23305E" stroke-width="2" stroke-linejoin="round"/><rect x="${x - 3}" y="${y - 1}" width="6" height="9" fill="#C48A5A"/></g>`;
    const mount = (x, y, w, h, c, snow) => `<path d="M${x - w} ${y} L${x} ${y - h} L${x + w} ${y} Z" fill="${c}" stroke="#23305E" stroke-width="2" stroke-linejoin="round"/>${snow ? `<path d="M${x - w * 0.3} ${y - h * 0.7} L${x} ${y - h} L${x + w * 0.3} ${y - h * 0.7} L${x + w * 0.1} ${y - h * 0.62} L${x - w * 0.08} ${y - h * 0.72} Z" fill="#fff"/>` : ''}`;
    const lolli = (x, y, c) => `<g><rect x="${x - 2}" y="${y}" width="4" height="22" fill="#fff" stroke="#23305E" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="11" fill="${c}" stroke="#23305E" stroke-width="2"/><path d="M${x - 6} ${y} a6 6 0 1 1 12 0 a4 4 0 1 1 -8 0" fill="none" stroke="#fff" stroke-width="2.4"/></g>`;
    let deco = '';
    // 0 微風鎮
    deco += house(100, 545, '#FF7A6B') + house(185, 548, '#4F8EF0') + house(150, 565, '#FFD23F');
    // 1 森林
    [[280, 410], [300, 395], [262, 440], [370, 420], [390, 440], [350, 400], [395, 480], [255, 480]].forEach(([x, y], i) => (deco += tree(x, y, 13 + (i % 3) * 3)));
    // 2 海邊
    deco += `<path d="M95 300 Q130 280 120 340 Q110 390 130 410 Q90 400 80 360 Z" fill="#FFE4A8" stroke="#E8C27A" stroke-width="2"/>`;
    deco += `<g transform="translate(120 330)"><path d="M0 26 Q3 10 0 0" stroke="#9A6A3A" stroke-width="4" fill="none"/><path d="M0 0 Q-14 -4 -20 6 Q-10 -2 0 0 Q-6 -14 -16 -14 Q-4 -8 0 0 Q10 -14 20 -10 Q6 -6 0 0 Q14 -2 18 10 Q10 2 0 0" fill="#4FB05A"/></g>`;
    // 3 火山
    deco += `<path d="M330 260 L380 190 Q400 182 420 190 L470 260 Z" fill="#9A5A48" stroke="#23305E" stroke-width="2.5" stroke-linejoin="round"/><path d="M380 190 Q400 182 420 190 L410 204 Q400 198 390 204 Z" fill="#FF6A3D"/><path d="M395 196 Q388 220 378 240" stroke="#FF8A3D" stroke-width="4" fill="none" stroke-linecap="round"/><g fill="#C8B8B0" opacity=".85"><circle cx="402" cy="170" r="10"/><circle cx="414" cy="156" r="8"/><circle cx="406" cy="142" r="6"/></g>`;
    // 4 城市
    [[565, 330, 22, 46, '#C9D6F2'], [592, 336, 18, 36, '#FFD9E6'], [612, 326, 16, 52, '#D7F5E8'], [520, 334, 18, 30, '#FFF0C2']].forEach(([x, y, w, h, c]) => {
      deco += `<rect x="${x}" y="${y - h}" width="${w}" height="${h}" rx="3" fill="${c}" stroke="#23305E" stroke-width="2"/><rect x="${x + 4}" y="${y - h + 6}" width="${w - 8}" height="4" fill="#fff"/><rect x="${x + 4}" y="${y - h + 16}" width="${w - 8}" height="4" fill="#fff"/>`;
    });
    // 5 糖果
    deco += `<ellipse cx="720" cy="505" rx="80" ry="34" fill="#FFD0E6" opacity=".8"/>` + lolli(660, 485, '#FF8FC0') + lolli(760, 500, '#8FD6FF') + lolli(740, 440, '#FFE14D');
    // 6 岩山
    deco += mount(880, 340, 46, 80, '#A99B8A', true) + mount(920, 360, 34, 56, '#8D7E6C', false) + mount(790, 290, 30, 50, '#B8AA98', true);
    // 7 月影
    deco += `<ellipse cx="640" cy="225" rx="90" ry="52" fill="#4A3F8A" opacity=".55"/><path d="M684 168 A16 16 0 1 0 684 200 A12 12 0 1 1 684 168 Z" fill="#FFF3B0"/>` + [[590, 190], [700, 250], [610, 262], [560, 230]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2" fill="#fff"/>`).join('');
    // 8 龍之谷
    deco += mount(860, 120, 36, 76, '#8E7BD6', true) + mount(900, 140, 26, 50, '#6F5CC0', false) + mount(760, 110, 28, 52, '#A493E6', true);
    // 9 競技場
    deco += `<g><ellipse cx="470" cy="80" rx="62" ry="22" fill="#FFE07A" stroke="#23305E" stroke-width="2.5"/><ellipse cx="470" cy="76" rx="44" ry="13" fill="#9ED97A" stroke="#23305E" stroke-width="2"/><path d="M420 64 V40 M520 64 V40" stroke="#23305E" stroke-width="2"/><path d="M420 40 l14 5 -14 5 Z M520 40 l14 5 -14 5 Z" fill="#FF5D8F"/></g>`;

    const path = smooth(L.map((l) => ({ x: l.x, y: l.y })));
    const unlockedPath = smooth(L.slice(0, s.unlocked + 1).map((l) => ({ x: l.x, y: l.y })));
    const nodes = L.map((l) => {
      const open = l.id <= s.unlocked;
      const here = l.id === s.loc;
      const done = l.gym ? (l.gym.final ? s.champion : s.badges >= l.id) : s.unlocked > l.id;
      return `<g class="map-node${open ? '' : ' locked'}" data-act="goto" data-id="${l.id}" role="button" aria-label="${l.name}${open ? '' : '（還沒解鎖）'}">
        <g class="ring"><circle cx="${l.x}" cy="${l.y}" r="${here ? 27 : 23}" fill="${open ? l.color : '#B9BFD6'}" stroke="#23305E" stroke-width="4"/>
        <circle cx="${l.x}" cy="${l.y}" r="${here ? 19 : 16}" fill="#fff" opacity=".92"/>

      <path d="M128 558 C74 522 64 440 106 396 C76 336 90 272 146 250 C152 184 222 142 294 156 C336 92 444 62 526 80 C598 50 702 58 760 92 C842 64 940 102 944 182 C976 252 950 330 914 376 C948 440 924 524 856 550 C758 586 640 560 556 578 C458 596 378 568 298 578 C220 586 168 582 128 558 Z" fill="url(#land)"/>

  function locPanel(loc) {

    </div></div>`, async (act, el) => {

      if (act === 'wild') { await G.Game.wild(loc); return S.map(); }

        G.Sound.sfx('heal');

  // ── 道館挑戰 ──
  S.gym = async (loc) => {
    const s = G.Game.state;
    const g = loc.gym;
    const list = [...g.trainers, g.leader];
    const prog = Math.min(s.gymProg[loc.id] || 0, list.length);
    const leader = G.TRAINERS[g.leader];
    const done = prog >= list.length;
    const nextId = done ? g.leader : list[prog];
    const nextT = G.TRAINERS[nextId];

    const rows = list.map((id, i) => {
      const t = G.TRAINERS[id];

      return `<div class="tr-row"><div class="tr-face">${G.Art.person(t.look)}</div><div class="tr-info"><b>${t.cls} ${t.name}</b><br><small>${G.resolveTeam(t, s.starter).length} 隻萌獸</small></div>${st}</div>`;

    const v = await G.UI.modal({
      title: `🏟️ ${g.name}`,
      wide: true,
      body: `<div class="two-col">
        <div class="tip-card panel" style="box-shadow:none">
          <div class="row" style="flex-wrap:nowrap"><div style="width:100px;height:108px;flex:none;background:#FFF3BF;border:3px solid var(--ink);border-radius:16px;overflow:hidden">${G.Art.person(leader.look)}</div>
          <div><h3 style="margin:0">${leader.cls} ${leader.name}</h3><div class="row" style="margin:6px 0">${typeHtml}</div><p class="small muted" style="margin:0">「${leader.intro}」</p></div></div>
          <p class="help-tip" style="margin-top:12px">💡 攻略提示：${leader.tip}</p>
          <p class="small muted">館主的王牌會使用「🌟星光巨大化」。你也可以在選招式時按下巨大化按鈕，一場對戰可以用一次！</p>
        </div>
        <div>${rows}</div></div>`,
      buttons: [
        { label: '先去準備', value: 'no', cls: 'white' },
        { label: done ? `再次挑戰 ${leader.name}` : `挑戰 ${nextT.name}！`, value: 'go', cls: 'pink' },
      ],
    });
    if (v !== 'go') return;
    const res = await G.Game.fightTrainer(nextId, { gym: true, bg: g.final ? 'champion' : 'arena', accent: g.type !== 'champion' ? G.TYPE_INFO[g.type].color : null });
    if (res === 'win' && !done) {
      s.gymProg[loc.id] = prog + 1;
      G.Game.save();
      if (prog + 1 >= list.length) {
        if (g.final) await G.Game.championEnding();
        else await G.Game.badgeCeremony(loc);
      } else {
        G.UI.toast('✔ 通過了！準備好就挑戰下一位吧。', 2600);
      }
    }
    S.map();
  };
})();

    const locked = G.SHOP_ORDER.filter((k) => !avail.includes(k));
    const draw = () => {
      G.UI.render(`${G.UI.hud()}<div class="screen"><div class="page" style="max-width:820px">
        <div class="page-head"><h2>🛒 萌獸商店</h2><span class="num" style="font-size:18px">💰 ${U.fmtMoney(s.money)}</span></div>
        <div class="item-list">${avail.map((k) => {
          const it = G.ITEMS[k], q = qty[k] || 1;
          return `<div class="item-row"><div class="item-ico">${G.UI.itemIcon(k)}</div>
            <div class="item-info"><b>${it.name}</b> <span class="num small muted">$${it.price}</span><p>${it.desc}　<span class="muted">（擁有 ${s.bag[k] || 0}）</span></p></div>
            <div class="qty-ctl"><button class="btn sm white" data-act="minus" data-id="${k}" aria-label="減少">−</button><span class="num" style="min-width:26px;text-align:center;font-weight:700">${q}</span><button class="btn sm white" data-act="plus" data-id="${k}" aria-label="增加">＋</button></div>
            <button class="btn sm pink" data-act="buy" data-id="${k}" ${s.money < it.price * q ? 'disabled' : ''}>買 $${it.price * q}</button></div>`;
        }).join('')}</div>
        ${locked.length ? `<p class="small muted">🔒 拿到更多徽章後會開始賣：${locked.map((k) => `${G.ITEMS[k].name}（${G.ITEMS[k].badge} 個徽章）`).join('、')}</p>` : ''}
      </div></div>`, (act, el) => {
        if (G.UI.hudAct(act)) return;
        const k = el.dataset.id;
        if (act === 'plus') { qty[k] = Math.min(20, (qty[k] || 1) + 1); G.Sound.sfx('click'); draw(); }
        if (act === 'minus') { qty[k] = Math.max(1, (qty[k] || 1) - 1); G.Sound.sfx('click'); draw(); }
        if (act === 'buy') {
          const q = qty[k] || 1, cost = G.ITEMS[k].price * q;
          if (s.money < cost) return;
          s.money -= cost;
          s.bag[k] = (s.bag[k] || 0) + q;
          G.Game.save();
          G.Sound.sfx('buy');
          G.UI.toast(`買了 ${G.ITEMS[k].name} ×${q}！`);
          draw();
        }
      });
    };
    draw();
  };
})();

(function () {
  const U = G.U;
  const S = G.Screens;

  S.dex = () => {
    const s = G.Game.state;
    const seen = G.DEX_ORDER.filter((k) => s.dex[k]).length;
    const caught = G.DEX_ORDER.filter((k) => s.dex[k] === 2).length;
    const cells = G.DEX_ORDER.map((k) => {
      const sp = G.SPECIES[k], st = s.dex[k];
      return `<button class="dex-cell${st ? '' : ' unseen silhouette'}" data-act="dex" data-id="${k}">
        <div class="da">${G.Art.mon(k, { cls: 'still' })}</div>
        <div class="no">No.${String(sp.no).padStart(3, '0')} ${st === 2 ? '<span class="caught">●</span>' : ''}</div>
        <div class="dn">${st ? sp.name : '？？？'}</div></button>`;
    }).join('');
    G.UI.render(`${G.UI.hud()}<div class="screen"><div class="page">
      <div class="page-head"><h2>📖 萌獸圖鑑</h2><span class="num">看過 ${seen}／抓到 ${caught}／全部 ${G.DEX_ORDER.length}</span></div>
      <p class="small muted" style="margin:0">● 表示已經抓到。遇到過的萌獸可以點開看詳細資料和出沒地點。</p>
      <div class="dex-grid">${cells}</div>
    </div></div>`, (act, el) => {
      if (G.UI.hudAct(act)) return;
      if (act === 'dex') S.dexEntry(el.dataset.id);
    });
  };

  S.dexEntry = (k) => {
    const s = G.Game.state;
    if (!s.dex[k]) { G.UI.toast('還沒遇過這隻萌獸，去野外找找看吧！'); return; }
    const sp = G.SPECIES[k];
    const chain = G.evoChain(k);
    const chainHtml = chain.map((c, i) => {
      const lv = i > 0 ? G.SPECIES[chain[i - 1]].evo.lv : 0;
      const known = s.dex[c];
      return `${i ? `<div class="small muted" style="align-self:center">→ Lv.${lv} →</div>` : ''}<div style="width:86px;text-align:center" class="${known ? '' : 'silhouette'}">${G.Art.mon(c, { cls: 'still' })}<div class="small">${known ? G.SPECIES[c].name : '？？？'}</div></div>`;
    }).join('');
    const where = G.LOCS.filter((l) => l.wild && l.wild.list.some(([x]) => x === k)).map((l) => l.name);
    const names = ['HP', '攻擊', '防禦', '特攻', '特防', '速度'];
    const stats = sp.bs.map((v, i) => `<div class="stat-row" style="grid-template-columns:46px 36px minmax(0,1fr)"><span>${names[i]}</span><span class="v">${v}</span><div class="stat-bar"><i style="width:${Math.min(100, v / 1.5)}%"></i></div></div>`).join('');
    const ab = G.ABILITIES[sp.ab];
    const prof = G.defProfile(sp.types);
    G.UI.modal({
      title: `No.${String(sp.no).padStart(3, '0')} ${sp.name}`,
      wide: true,
      body: `<div class="sum-grid"><div><div class="sum-art">${G.Art.mon(k)}</div><div class="row" style="margin-top:8px">${G.UI.types(sp.types)}</div></div>
        <div style="min-width:0"><p style="margin:0 0 10px;line-height:1.7">${sp.desc}</p>
        ${ab ? `<p class="help-ab">特性 <b>${ab.name}</b>：${ab.desc}</p>` : ''}
        <p class="small" style="margin:6px 0"><b>怕：</b>${[...prof.x4, ...prof.x2].map((t) => G.Art.typeBadge(t, true)).join(' ') || '沒有'}</p>
        <p class="small" style="margin:6px 0"><b>不怕：</b>${[...prof.half, ...prof.quarter, ...prof.zero].map((t) => G.Art.typeBadge(t, true)).join(' ') || '沒有'}</p>
        <h4 style="margin:10px 0 4px">基礎能力</h4>${stats}
        <h4 style="margin:12px 0 4px">進化</h4><div class="row" style="flex-wrap:nowrap;overflow-x:auto">${chain.length > 1 ? chainHtml : '<span class="muted small">不會進化</span>'}</div>
        <p class="small muted">出沒地點：${where.length ? where.join('、') : '野外找不到，可能要靠進化或其他方法'}</p>
        <p class="small muted">捕捉難度：${sp.rate >= 190 ? '★ 容易' : sp.rate >= 100 ? '★★ 普通' : sp.rate >= 45 ? '★★★ 困難' : '★★★★ 非常困難'}</p></div></div>`,
    });
  };

  // ── 屬性相剋表 ──
  function chartTable() {
    const T = G.TYPES;
    const head = T.map((t) => `<th><span class="ti" style="--tc:${G.TYPE_INFO[t].color}" title="${G.TYPE_INFO[t].name}（防守）">${G.TYPE_INFO[t].icon}</span></th>`).join('');
    const rows = T.map((a) => `<tr data-row="${a}"><th><span class="ti" style="--tc:${G.TYPE_INFO[a].color}" data-type="${a}">${G.TYPE_INFO[a].icon}</span> <b class="small">${G.TYPE_INFO[a].name}</b></th>${T.map((d) => {
      const e = G.eff1(a, d);
      const cls = e === 2 ? 'c2' : e === 0.5 ? 'ch' : e === 0 ? 'c0' : '';
      const txt = e === 2 ? '2' : e === 0.5 ? '½' : e === 0 ? '0' : '';
      return `<td class="${cls}" data-col="${d}" title="${G.TYPE_INFO[a].name} 打 ${G.TYPE_INFO[d].name}：×${e}">${txt}</td>`;
    }).join('')}</tr>`).join('');
    return `<div class="chart-legend"><span><i style="background:#3FCB85"></i>2 = 效果絕佳</span><span><i style="background:#FFB547"></i>½ = 效果不好</span><span><i style="background:#3B4060"></i>0 = 沒有效果</span><span class="muted">空白 = 普通（×1）</span></div>
      <p class="small muted" style="margin:6px 0">← 左邊是<b>攻擊</b>的招式屬性，上面是<b>被打</b>的萌獸屬性。點左邊的屬性圖示可以看說明。</p>
      <div class="chart-wrap"><table class="chart"><thead><tr><th class="small">攻＼守</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function calcHTML(sel) {
    const pick = G.TYPES.map((t) => `<button data-calc="${t}" class="${sel.includes(t) ? 'on' : ''}" aria-pressed="${sel.includes(t)}">${G.Art.typeBadge(t)}</button>`).join('');
    let out = '<p class="muted small" style="margin:8px 0 0">選一個或兩個屬性（像是「岩石＋地面」），看看牠怕什麼！</p>';
    if (sel.length) {
      const p = G.defProfile(sel);
      const line = (lab, arr, cls) => `<div class="help-row"><span class="lab ${cls}" style="width:84px">${lab}</span><div class="vals">${arr.length ? arr.map((t) => G.Art.typeBadge(t, true)).join('') : '<span class="muted small">沒有</span>'}</div></div>`;
      out = `<div style="margin-top:10px">${line('×4 超怕', p.x4, 'g')}${line('×2 怕', p.x2, 'g')}${line('×½ 不怕', p.half, 'b')}${line('×¼ 很不怕', p.quarter, 'b')}${line('×0 完全免疫', p.zero, 'z')}</div>`;
    }
    return `<div class="type-pick">${pick}</div>${out}`;
  }

  function typeTip(t) {
    const ti = G.TYPE_INFO[t];
    const strong = G.TYPES.filter((d) => G.eff1(t, d) === 2);
    const weak = G.TYPES.filter((a) => G.eff1(a, t) === 2);
    return `<h3>${G.Art.typeBadge(t)} 屬性小教室</h3><p>${G.TYPE_TIPS[t]}</p>
      <p class="small"><b>打誰最有效：</b>${strong.map((x) => G.Art.typeBadge(x, true)).join(' ') || '沒有'}</p>
      <p class="small"><b>被誰打最痛：</b>${weak.map((x) => G.Art.typeBadge(x, true)).join(' ') || '沒有'}</p>`;
  }

  function bindChart(root) {
    let sel = [];
    const calc = root.querySelector('#calc');
    const tip = root.querySelector('#tip');
    root.addEventListener('click', (e) => {
      const c = e.target.closest('[data-calc]');
      if (c) {
        const t = c.dataset.calc;
        if (sel.includes(t)) sel = sel.filter((x) => x !== t);
        else sel = sel.length >= 2 ? [sel[1], t] : [...sel, t];
        G.Sound.sfx('click');
        calc.innerHTML = calcHTML(sel);
        return;
      }
      const ty = e.target.closest('[data-type]');
      if (ty && tip) {
        const t = ty.dataset.type;
        root.querySelectorAll('.chart tr').forEach((r) => r.classList.toggle('hl', r.dataset.row === t));
        tip.innerHTML = typeTip(t);
        G.Sound.sfx('click');
      }
    });
    root.addEventListener('mouseover', (e) => {
      const td = e.target.closest('td[data-col]');
      root.querySelectorAll('td.hlc').forEach((x) => x.classList.remove('hlc'));
      if (td) root.querySelectorAll(`td[data-col="${td.dataset.col}"]`).forEach((x) => x.classList.add('hlc'));
    });
  }

  S.types = () => {
    G.UI.render(`${G.UI.hud()}<div class="screen"><div class="page">
      <div class="page-head"><h2>🔥 屬性相剋表</h2></div>
      <div class="two-col">
        <div class="tip-card panel" id="tip">${typeTip('fire')}</div>
        <div class="tip-card panel"><h3>🧮 屬性計算機</h3><div id="calc">${calcHTML([])}</div></div>
      </div>
      <div class="panel" style="padding:12px">${chartTable()}</div>
      <div class="tip-card panel"><h3>📝 對戰小訣竅</h3>
        <p>1. <b>同屬性加成</b>：萌獸使用和自己一樣屬性的招式，威力 ×1.5。</p>
        <p>2. <b>雙屬性</b>的萌獸，倍率會相乘：×2 × ×2 = ×4，×2 × ×½ = ×1。</p>
        <p>3. 被剋制的時候，<b>換上能抵抗的夥伴</b>，讓對手的攻擊變得不痛。</p>
        <p>4. 記不住的時候，對戰畫面旁邊的「屬性小幫手」會幫你標出 ×2 的招式！</p>
      </div>
    </div></div>`, (act) => G.UI.hudAct(act));
    bindChart(document.querySelector('.page'));
    document.querySelector('.chart tr[data-row="fire"]').classList.add('hl');
  };

  S.typesModal = () => {
    G.UI.modal({
      title: '📖 屬性相剋表',
      wide: true,
      body: `<div class="tip-card panel" id="tip" style="margin-bottom:12px;box-shadow:none">${typeTip('water')}</div>${chartTable()}<div class="tip-card" style="padding:12px 0 0"><h3>🧮 屬性計算機</h3><div id="calc">${calcHTML([])}</div></div>`,
      onRender: (el) => bindChart(el),
    });
  };
})();
